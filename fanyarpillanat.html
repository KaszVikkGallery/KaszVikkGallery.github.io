<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fanyar pillanat – Kasz Vikk</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#fff;
  color:#222;
}

/* ===== KOSÁR ===== */

#cartBtn{
  position:fixed;
  top:20px;
  left:20px;
  background:black;
  color:white;
  padding:14px 18px;
  font-size:20px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  z-index:2000;
}

#cartCount{
  background:red;
  padding:5px 10px;
  border-radius:50%;
  margin-left:8px;
}

/* ===== TERMÉK ===== */

h1{
  font-size:34px;
  margin-top:90px;
}

.main-image{
  max-width:80%;
  margin-top:20px;
  cursor:zoom-in;
}

p{
  font-size:22px;
  margin:10px auto;
  max-width:800px;
}

button{
  font-size:18px;
  padding:12px 18px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

.back-btn{
  margin-top:20px;
  font-size:18px;
  padding:12px 18px;
  background:#f2f2f2;
  color:#222;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

#lightbox img{
  max-width:85%;
  max-height:85%;
}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  cursor:pointer;
  user-select:none;
}

#prev{ left:30px; }
#next{ right:30px; }

</style>
</head>

<body>

<!-- ===== KOSÁR GOMB (UGYANAZ MINT BOR) ===== -->
<button id="cartBtn">
🛒 <span id="cartCount">0</span>
</button>

<h1>Fanyar pillanat</h1>

<img class="main-image" src="fanyarpillanat.jpg" onclick="openLightbox()">

<p> Egy spontán, éjszaka készült portré fiktív személyről. </p>
<p>Technika: Akril</p>
<p>Méret: 10 × 15 cm</p>
<p>Ára: 3000 Ft</p>

<button onclick="addToCart('Fanyar pillanat', 3000)">
Kosárba
</button>

<button class="back-btn" onclick="window.location.href='index.html'">
← Vissza
</button>

<!-- ===== LIGHTBOX ===== -->
<div id="lightbox" onclick="closeLightbox()">

  <div id="prev" class="arrow" onclick="event.stopPropagation(); prev()">◀</div>

  <img id="lightboxImg">

  <div id="next" class="arrow" onclick="event.stopPropagation(); next()">▶</div>

</div>

<!-- ===== KÖZÖS KOSÁR RENDSZER (UGYANAZ MINT BOR) ===== -->
<script src="cart.js"></script>

<script>

/* ===== KOSÁR SZINKRON ===== */
window.addEventListener("load", ()=>{
  if(typeof updateCartCount === "function"){
    updateCartCount();
  }
});

/* ===== KÉPEK ===== */

const images = [
  "fanyarpillanatkeret.jpg",
  "fanyarpillanatoldal.jpg",
  "fanyarpillanatoldal2.jpg"
];

let current = 0;

/* ===== LIGHTBOX ===== */

function openLightbox(){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightboxImg").src = images[current];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

function next(){
  current = (current + 1) % images.length;
  document.querySelector(".main-image").src = images[current];
  document.getElementById("lightboxImg").src = images[current];
}

function prev(){
  current = (current - 1 + images.length) % images.length;
  document.querySelector(".main-image").src = images[current];
  document.getElementById("lightboxImg").src = images[current];
}

</script>

</body>
</html>
