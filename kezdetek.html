<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kezdetek – Kasz Vikk</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#fff;
  color:#222;
}

/* ===== CÍM ===== */
h1{
  font-size:34px;
  margin-top:90px;
}

/* ===== SZÖVEG ===== */
p{
  font-size:20px;
  margin:10px auto;
  max-width:800px;
  line-height:1.4;
}

/* ===== KÉP ===== */
.main-image{
  max-width:80%;
  margin-top:20px;
  cursor:zoom-in;
}

/* ===== GOMBOK ===== */
button{
  font-size:18px;
  padding:12px 18px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

.back-btn{
  margin-top:20px;
  background:#f2f2f2;
  color:#222;
}

/* ===== LIGHTBOX ===== */
#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  cursor:pointer;
}

#prev{ left:30px; }
#next{ right:30px; }

/* ===== KOSÁR ===== */
#openCart{
position:fixed;
top:14px;
left:14px;
background:black;
color:white;
padding:12px 16px;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
z-index:5000;
}

#cartCount{
background:red;
color:white;
border-radius:50%;
padding:4px 10px;
font-size:16px;
margin-left:8px;
}

#cartOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:5500;
}

#cartDrawer{
  position:fixed;
  top:0;
  right:-100%;
  width:90%;
  max-width:380px;
  height:100%;
  background:white;
  z-index:6000;
  transition:0.3s;
  display:flex;
  flex-direction:column;
}

#cartDrawer.open{ right:0; }
#cartOverlay.show{ display:block; }

.cart-content{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.remove{
  color:red;
  cursor:pointer;
}

.cart-summary{
  border-top:1px solid #ddd;
  padding:15px;
}

select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

#total{
  font-size:20px;
  font-weight:bold;
}

</style>
</head>

<body>

<button id="openCart" onclick="toggleCart()">🛒 <span id="cartCount">0</span></button>

<div id="cartOverlay" onclick="toggleCart()"></div>

<div id="cartDrawer">
  <div class="cart-content">
    <h2>Kosár</h2>
    <div id="cartItems"></div>
  </div>

  <div class="cart-summary">
    <select id="shipping" onchange="renderCart()">
      <option value="0">Szállítás</option>
      <option value="1699">Foxpost</option>
      <option value="1490">Packeta</option>
    </select>

    <div id="total"></div>

    <button onclick="checkout()">Fizetés</button>
  </div>
</div>

<h1>Kezdetek</h1>

<img class="main-image" src="kezdetekmessze.jpg" onclick="openLightbox()">

<div>
  <button onclick="prev()">◀</button>
  <button onclick="next()">▶</button>
</div>

<p>Absztrakt stílusú festmény, a bizonytalanság és a remény találkozása.</p>
<p>Technika: Akril</p>
<p>Méret: 20 × 20 cm</p>
<p>Ár: 2000 Ft</p>

<button onclick="addToCart('Kezdetek', 2000)">Kosárba</button>
<button class="back-btn" onclick="window.location.href='index.html'">← Vissza</button>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <div id="prev" class="arrow" onclick="event.stopPropagation(); prev()">◀</div>
  <img id="lightboxImg">
  <div id="next" class="arrow" onclick="event.stopPropagation(); next()">▶</div>
</div>

<script>

const images = ["kezdetekmessze.jpg","kezdetekjobb.jpg","kezdetekbal.jpg"];
let current = 0;

function openLightbox(){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightboxImg").src = images[current];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

function next(){
  current = (current + 1) % images.length;
  document.querySelector(".main-image").src = images[current];
  document.getElementById("lightboxImg").src = images[current];
}

function prev(){
  current = (current - 1 + images.length) % images.length;
  document.querySelector(".main-image").src = images[current];
  document.getElementById("lightboxImg").src = images[current];
}

/* KOSÁR */

let cart = [];

function toggleCart(){
  document.getElementById("cartDrawer").classList.toggle("open");
  document.getElementById("cartOverlay").classList.toggle("show");
}

function addToCart(name, price){
  if(cart.some(i => i.name === name)) return;
  cart.push({name, price});
  updateCart();
}

function updateCart(){
  const box = document.getElementById("cartItems");
  box.innerHTML = "";
  let total = 0;

  cart.forEach(i => {
    box.innerHTML += `
      <div class="cart-item">
        <span>${i.name}</span>
        <span>${i.price} Ft</span>
      </div>
    `;
    total += i.price;
  });

  const shipping = parseInt(document.getElementById("shipping").value);
  document.getElementById("total").innerText =
    "Összesen: " + (total + shipping) + " Ft";

  document.getElementById("cartCount").innerText = cart.length;
}

function checkout(){
  if(cart.length === 0) return alert("Üres kosár");
  alert("Fizetés indul...");
}

</script>

</body>
</html>
