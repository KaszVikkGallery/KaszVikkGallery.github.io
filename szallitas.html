<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Kasz Vikk – Szállítás</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    /* ===== MENÜ GOMB ===== */
    .menu-button {
      position: fixed;
      top: 20px;
      right: 25px;
      font-size: 70px;
      cursor: pointer;
      z-index: 2000;
      user-select: none;
    }

    /* ===== OLDALSÓ MENÜ ===== */
    nav {
      position: fixed;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100%;
      background: #ffffff;
      border-left: 1px solid #ddd;
      padding-top: 120px;
      transition: right 0.3s ease;
      z-index: 1500;
    }

    nav.open {
      right: 0;
    }

    nav a {
      display: block;
      padding: 25px 35px;
      font-size: 38px;
      color: #222;
      text-decoration: none;
    }

    nav a:hover {
      background: #f2f2f2;
    }

    /* ===== TARTALOM ===== */
    .container {
      max-width: 1000px;
      margin: 160px auto 60px;
      padding: 0 20px;
      text-align: center;
    }

    .shipping-text {
      font-size: 40px;
      line-height: 1.7;
      max-width: 800px;
      margin: 30px auto;
    }

    .highlight {
      font-weight: bold;
      color: #0077cc;
    }

    /* ===== LÁBLÉC ===== */
    footer {
      text-align: center;
      margin: 80px 0 30px;
      font-size: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <!-- MENÜ GOMB -->
  <div class="menu-button" onclick="toggleMenu()">☰</div>

  <!-- MENÜ -->
  <nav id="menu">
    <a href="bemutatkozas.html">Bemutatkozás</a>
    <a href="index.html">Galéria</a>
    <a href="kapcsolat.html">Kapcsolat</a>
    <a href="szallitas.html">Szállítás</a>
  </nav>

  <!-- TARTALOM -->
  <div class="container">
    <div class="shipping-text">
      <p>Szállítási lehetőségek:</p>

      <p>
        <span class="highlight">Személyes átvétel:</span><br>
        Zalaegerszegen, ingyenes.
      </p>

      <p>
        <span class="highlight">FoxPost csomagküldés:</span><br>
        1700 Forint.
      </p>

      <p>
        Kérdés esetén írj bátran:<br>
        <a href="mailto:karloszdzseszi@gmail.com" class="highlight">
          karloszdzseszi@gmail.com
        </a>
      </p>
    </div>
  </div>

  <footer>
    © Kasz Vikk
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById("menu").classList.toggle("open");
    }
  </script>

</body>
</html>
