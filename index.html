<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bor – Kasz Vikk</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#fff;
  color:#222;
}

/* ===== KOSÁR GOMB ===== */

#cartBtn{
  position:fixed;
  top:20px;
  left:20px;
  background:black;
  color:white;
  padding:14px 18px;
  font-size:20px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  z-index:2000;
}

#cartCount{
  background:red;
  padding:5px 10px;
  border-radius:50%;
  margin-left:8px;
}

/* ===== KÉP ===== */

h1{
  font-size:34px;
  margin-top:100px;
}

.main-image{
  max-width:80%;
  margin-top:20px;
  cursor:zoom-in;
}

/* ===== SZÖVEG ===== */

p{
  font-size:24px;
  margin:10px auto;
  max-width:800px;
}

/* ===== GOMB ===== */

button{
  font-size:18px;
  padding:12px 18px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

#lightbox img{
  max-width:95%;
  max-height:95%;
}

/* ===== NYILAK ===== */

.controls button{
  margin:10px;
  font-size:20px;
  padding:10px 14px;
}

/* ===== KOSÁR ===== */

#cartDrawer{
  position:fixed;
  top:0;
  right:-420px;
  width:360px;
  height:100%;
  background:white;
  z-index:6000;
  transition:0.3s;
  box-shadow:-10px 0 25px rgba(0,0,0,0.15);
  display:flex;
  flex-direction:column;
}

#cartDrawer.open{
  right:0;
}

.cart-content{
  padding:20px;
  overflow-y:auto;
  flex:1;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-name{
  font-size:18px;
}

.cart-price{
  font-size:16px;
  color:#666;
}

.remove{
  color:red;
  cursor:pointer;
  font-size:22px;
}

/* ===== ALSÓ RÉSZ ===== */

.cart-summary{
  padding:20px;
  border-top:1px solid #ddd;
}

select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

#total{
  font-size:22px;
  margin-bottom:10px;
}

/* ===== LIGHTBOX NAV ===== */

.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  background:rgba(0,0,0,0.3);
  border:none;
  cursor:pointer;
  padding:10px 15px;
}

#prevBtn{left:10px;}
#nextBtn{right:10px;}

</style>
</head>

<body>

<!-- KOSÁR -->
<button id="cartBtn" onclick="toggleCart()">
🛒 <span id="cartCount">0</span>
</button>

<h1>Bor</h1>

<img class="main-image" src="bor.jpg" onclick="openLightbox()">

<div class="controls">
  <button onclick="prev()">◀</button>
  <button onclick="next()">▶</button>
</div>

<p>Lakkozott csendélet festmény.</p>
<p>Technika: Akril</p>
<p>Méret: 10 × 25 cm</p>
<p>Ára: 3500 Ft</p>

<button onclick="addToCart()">Kosárba</button>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">

  <button class="nav-btn" id="prevBtn" onclick="event.stopPropagation(); prev()">‹</button>
  <img id="lightboxImg">
  <button class="nav-btn" id="nextBtn" onclick="event.stopPropagation(); next()">›</button>

</div>

<!-- KOSÁR -->
<div id="cartDrawer">

  <div class="cart-content">
    <h2>Kosár</h2>
    <div id="cartItems"></div>
  </div>

  <div class="cart-summary">

    <select id="shipping" onchange="renderCart()">
      <option value="0">Szállítás</option>
      <option value="1699">Foxpost</option>
      <option value="1490">Packeta</option>
    </select>

    <div id="total">0 Ft</div>

    <button onclick="checkout()">Fizetés</button>

  </div>

</div>

<script>

/* ===== KÉPEK ===== */

const images = [
  "bor.jpg",
  "bormessze.jpg",
  "boroldal.jpg",
  "borközeloldal.jpg",
  "borhat.jpg"
];

let current = 0;

/* ===== LIGHTBOX ===== */

function openLightbox(){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightboxImg").src = images[current];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

function next(){
  current = (current + 1) % images.length;
  document.querySelector(".main-image").src = images[current];
}

function prev(){
  current = (current - 1 + images.length) % images.length;
  document.querySelector(".main-image").src = images[current];
}

/* ===== KÖZÖS KOSÁR ===== */

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(){

  if(!cart.find(i=>i.name==="Bor")){
    cart.push({name:"Bor",price:3500});
    saveCart();
    updateUI();
  }

}

function removeItem(name){
  cart = cart.filter(i=>i.name!==name);
  saveCart();
  updateUI();
}

function updateUI(){
  renderCart();
  document.getElementById("cartCount").innerText = cart.length;
}

function toggleCart(){
  document.getElementById("cartDrawer").classList.toggle("open");
}

function renderCart(){

  const box = document.getElementById("cartItems");
  box.innerHTML="";

  let total = 0;

  cart.forEach(i=>{

    let div = document.createElement("div");
    div.className="cart-item";

    div.innerHTML=`
      <span class="cart-name">${i.name}</span>
      <span class="cart-price">${i.price} Ft</span>
      <span class="remove" onclick="removeItem('${i.name}')">✕</span>
    `;

    box.appendChild(div);
    total += i.price;

  });

  let shipping = parseInt(document.getElementById("shipping").value) || 0;

  document.getElementById("total").innerText =
    "Összesen: " + (total + shipping) + " Ft";

}

function checkout(){
  alert("Stripe jön ide később");
}

updateUI();

</script>

</body>
</html>
