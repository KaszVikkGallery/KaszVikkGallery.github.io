<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Kasz Vikk – Webshop</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
}

/* MENÜ */
.menu-button {
  position: fixed;
  top: 20px;
  right: 25px;
  font-size: 60px;
  cursor: pointer;
  z-index: 2000;
}

nav {
  position: fixed;
  top: 0;
  right: -320px;
  width: 320px;
  height: 100%;
  background: #fff;
  border-left: 1px solid #ddd;
  padding-top: 100px;
  transition: 0.3s;
  z-index: 1500;
}

nav.open { right: 0; }

nav a {
  display: block;
  padding: 20px;
  font-size: 22px;
  text-decoration: none;
  color: #222;
}

/* HEADER */
header {
  text-align: center;
  padding: 120px 20px 20px;
}

header h1 {
  font-size: 40px;
}

/* GALÉRIA */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 35px;
  padding: 40px;
}

.item {
  text-align: center;
}

.item img {
  width: 100%;
  max-width: 420px;
  height: 280px;
  object-fit: cover;
  border-radius: 6px;
}

button {
  margin-top: 8px;
  padding: 10px 16px;
  cursor: pointer;
}

/* KOSÁR */
#cartBox {
  position: fixed;
  left: 20px;
  top: 120px;
  width: 300px;
  background: #fff;
  border: 1px solid #ddd;
  padding: 15px;
  border-radius: 10px;
  font-size: 16px;
}

#checkoutBtn {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  background: black;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- MENÜ -->
<div class="menu-button" onclick="toggleMenu()">☰</div>

<nav id="menu">
  <a href="index.html">Galéria</a>
  <a href="kapcsolat.html">Kapcsolat</a>
  <a href="szallitas.html">Szállítás</a>
</nav>

<!-- HEADER -->
<header>
  <h1>Kasz Vikk Webshop</h1>
</header>

<!-- KOSÁR -->
<div id="cartBox">
  <h3>Kosár</h3>

  <div id="cartItems"></div>

  <p>
    Szállítás:
    <select id="shipping" onchange="renderCart()">
      <option value="0">Válassz</option>
      <option value="1500">Foxpost</option>
      <option value="1500">Packeta</option>
    </select>
  </p>

  <p id="total">Összesen: 0 Ft</p>

  <button id="checkoutBtn" onclick="checkout()">Fizetés</button>
</div>

<!-- GALÉRIA -->
<section class="gallery" id="gallery"></section>

<!-- TERMÉKEK -->
<script>

const products = [
  {name:"Bor",price:3500,img:"bor.jpg",page:"bor.html"},
  {name:"Fanyar pillanat",price:3500,img:"fanyarpillanat.jpg",page:"fanyarpillanat.html"},
  {name:"Johnny Bravo",price:3500,img:"johnny.jpg",page:"johnny.html"},
  {name:"Hangokra várva",price:3500,img:"hangokravarva.jpg",page:"hangokravarva.html"},
  {name:"Rég múlt pillanat",price:3500,img:"regmultpillanat.jpg",page:"regmultpillanat.html"},
  {name:"Színek alkonya",price:3500,img:"szinekalkonya.jpg",page:"szinekalkonya.html"},
  {name:"Esti melódia",price:3500,img:"estimelodia.jpg",page:"estimelodia.html"},
  {name:"The jazz is freedom",price:3500,img:"thejazzisfreedom.jpg",page:"thejazzisfreedom.html"},
  {name:"A szív dala",price:3500,img:"szivdala.jpg",page:"aszivdala.html"},
  {name:"Nemes hűség",price:3500,img:"nemeshuseg.jpg",page:"nemeshuseg.html"},
  {name:"Morning Cat",price:3500,img:"morningcat.jpg",page:"morningcat.html"},
  {name:"Lidokain",price:3500,img:"lidokain.jpg",page:"lidokain.html"},
  {name:"Idő árnyéka",price:3500,img:"idoarnyeka.jpg",page:"idoarnyeka.html"},
  {name:"Sarki fény",price:3500,img:"sarkifeny.jpg",page:"sarkifeny.html"},
  {name:"Őszi fények",price:3500,img:"oszifenyek.jpg",page:"oszifenyek.html"},
  {name:"Holdfényes hegyek",price:3500,img:"holdfenyeshegyek.jpg",page:"holdfenyeshegyek.html"},
  {name:"Vöröslő űr",price:3500,img:"voroslour.jpg",page:"voroslour.html"},
  {name:"Átjáró",price:3500,img:"atjaro.jpg",page:"atjaro.html"},
  {name:"Tűz és hamu",price:3500,img:"tuzeshamu.jpg",page:"tuzeshamu.html"},
  {name:"Kezdetek",price:3500,img:"kezdetek.jpg",page:"kezdetek.html"},
  {name:"Elviselés",price:3500,img:"elviseles.jpg",page:"elviseles.html"}
];

let cart = [];

function toggleMenu() {
  document.getElementById("menu").classList.toggle("open");
}

function renderGallery() {
  const g = document.getElementById("gallery");

  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <a href="${p.page}">
        <img src="${p.img}">
        <h3>${p.name}</h3>
      </a>
      <button onclick="addToCart('${p.name}', ${p.price})">Kosárba</button>
    `;

    g.appendChild(div);
  });
}

function addToCart(name, price) {
  cart.push({name, price});
  renderCart();
}

function renderCart() {
  let box = document.getElementById("cartItems");
  box.innerHTML = "";

  let total = 0;

  cart.forEach(i => {
    let div = document.createElement("div");
    div.innerHTML = i.name + " - " + i.price + " Ft";
    box.appendChild(div);
    total += i.price;
  });

  let ship = parseInt(document.getElementById("shipping").value);
  if (!ship) ship = 0;

  total += ship;

  document.getElementById("total").innerText =
    "Összesen: " + total + " Ft";
}

function checkout() {
  if (cart.length === 0) {
    alert("Kosár üres!");
    return;
  }

  if (!document.getElementById("shipping").value || document.getElementById("shipping").value == 0) {
    alert("Válassz szállítást!");
    return;
  }

  let total = 0;
  cart.forEach(i => total += i.price);
  total += parseInt(document.getElementById("shipping").value);

  alert("Fizetés indítása: " + total + " Ft");

  // IDE JÖN STRIPE
  // window.location.href = "STRIPE_LINK";
}

renderGallery();

</script>

</body>
</html>
