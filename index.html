<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasz Vikk – Galéria</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#222;
}

/* ===== MENÜ GOMB ===== */

.menu-button{
  position:fixed;
  top:20px;
  right:25px;
  font-size:90px;
  cursor:pointer;
  z-index:5000;
  user-select:none;
}

/* ===== OLDALSÓ MENÜ ===== */

nav{
  position:fixed;
  top:0;
  right:-360px;
  width:340px;
  height:100%;
  background:#fff;
  border-left:1px solid #ddd;
  padding-top:120px;
  transition:0.35s;
  z-index:4000;
  box-shadow:-5px 0 20px rgba(0,0,0,0.08);
}

nav.open{
  right:0;
}

nav a{
  display:block;
  padding:28px;
  font-size:24px;
  text-decoration:none;
  color:#222;
  transition:0.2s;
}

nav a:hover{
  background:#f5f5f5;
}

/* ===== HEADER ===== */

header{
  text-align:center;
  padding:150px 20px 40px;
}

header h1{
  font-size:42px;
  margin:0;
  font-weight:600;
}

header p{
  font-size:26px;
  color:#666;
  margin-top:15px;
}

/* ===== GALÉRIA ===== */

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:40px;
  padding:40px;
}

.item{
  text-align:center;
  transition:0.25s;
}

.item:hover{
  transform:translateY(-4px);
}

.item a{
  text-decoration:none;
  color:inherit;
}

.item img{
  width:100%;
  max-width:420px;
  height:280px;
  object-fit:cover;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  transition:0.25s;
}

.item img:hover{
  transform:scale(1.02);
}

.item h3{
  font-size:24px;
  margin-top:16px;
  margin-bottom:14px;
  font-weight:500;
}

/* ===== GOMBOK ===== */

button{
  border:none;
  cursor:pointer;
  border-radius:12px;
  transition:0.2s;
}

button:hover{
  opacity:0.92;
}

/* ===== KOSÁR GOMB ===== */

#openCart{
  position:fixed;
  top:20px;
  left:20px;
  background:black;
  color:white;
  padding:18px 22px;
  font-size:24px;
  z-index:5000;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.18);
}

/* ===== PIROS SZÁMLÁLÓ ===== */

#cartCount{
  background:red;
  color:white;
  border-radius:50%;
  padding:7px 15px;
  font-size:24px;
  margin-left:10px;
}

/* ===== TERMÉK GOMB ===== */

.buy-btn{
  background:black;
  color:white;
  padding:16px 22px;
  font-size:22px;
}

/* ===== OVERLAY ===== */

#cartOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.35);
  display:none;
  z-index:5500;
}

#cartOverlay.show{
  display:block;
}

/* ===== KOSÁR ===== */

#cartDrawer{
  position:fixed;
  top:0;
  right:-480px;
  width:440px;
  height:100%;
  background:white;
  z-index:6000;
  transition:0.35s ease;
  box-shadow:-10px 0 35px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
}

#cartDrawer.open{
  right:0;
}

.cart-content{
  padding:28px;
  overflow-y:auto;
  flex:1;
}

/* ===== KOSÁR CÍM ===== */

#cartDrawer h2{
  font-size:42px;
  margin-top:0;
  margin-bottom:25px;
}

/* ===== KOSÁR TÉTELEK ===== */

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:20px 0;
  border-bottom:1px solid #eee;
}

/* ===== BAL OLDAL ===== */

.cart-left{
  display:flex;
  flex-direction:column;
}

.cart-name{
  font-size:28px;
  font-weight:500;
}

.cart-price{
  font-size:24px;
  color:#666;
  margin-top:4px;
}

/* ===== TÖRLÉS ===== */

.remove{
  color:red;
  font-size:34px;
  cursor:pointer;
}

/* ===== ALSÓ RÉSZ ===== */

.cart-summary{
  border-top:1px solid #ddd;
  padding:24px;
  background:white;
}

/* ===== SZÁLLÍTÁS ===== */

.shipping-title{
  font-size:24px;
  margin-bottom:10px;
}

select{
  width:100%;
  padding:14px;
  font-size:20px;
  border-radius:10px;
  margin-bottom:20px;
}

/* ===== ÖSSZESEN ===== */

#total{
  font-size:32px;
  font-weight:bold;
  margin-bottom:18px;
}

/* ===== FIZETÉS GOMB ===== */

#checkoutBtn{
  width:100%;
  background:black;
  color:white;
  padding:20px;
  font-size:24px;
  border-radius:14px;
}

/* ===== MOBIL ===== */

@media(max-width:700px){

  .gallery{
    grid-template-columns:1fr;
    padding:25px;
    gap:40px;
  }

  header h1{
    font-size:48px;
  }

  .item img{
    height:260px;
  }

  #cartDrawer{
    width:100%;
  }

}

</style>
</head>

<body>

<!-- ===== MENÜ ===== -->

<div class="menu-button" onclick="toggleMenu()">☰</div>

<nav id="menu">
  <a href="index.html">Galéria</a>
  <a href="bemutatkozas.html">Bemutatkozás</a>
  <a href="szallitas.html">Szállítás</a>
  <a href="kapcsolat.html">Kapcsolat</a>
</nav>

<!-- ===== FEJLÉC ===== -->

<header>
  <h1>Kasz Vikk Webshop</h1>
  <p>Eredeti akril festmények</p>
</header>

<!-- ===== KOSÁR GOMB ===== -->

<button id="openCart" onclick="toggleCart()">
🛒 Kosár
<span id="cartCount">0</span>
</button>

<!-- ===== OVERLAY ===== -->

<div id="cartOverlay" onclick="toggleCart()"></div>

<!-- ===== KOSÁR ===== -->

<div id="cartDrawer">

  <div class="cart-content">

    <h2>Kosár</h2>

    <div id="cartItems"></div>

  </div>

  <div class="cart-summary">

    <div class="shipping-title">Szállítás</div>

    <select id="shipping" onchange="renderCart()">
      <option value="0">Válassz szállítást</option>
      <option value="1699">Foxpost — 1699 Ft</option>
      <option value="1490">Packeta — 1490 Ft</option>
    </select>

    <div id="total">Összesen: 0 Ft</div>

    <button id="checkoutBtn" onclick="checkout()">
      Fizetés
    </button>

  </div>

</div>

<!-- ===== GALÉRIA ===== -->

<section class="gallery" id="gallery"></section>

<script>

/* ===== TERMÉKEK ===== */

const products = [

  {name:"Bor",price:3500,img:"bor.jpg",page:"bor.html"},
  {name:"Fanyar pillanat",price:3000,img:"fanyarpillanat.jpg",page:"fanyarpillanat.html"},
  {name:"Johnny Bravo",price:4000,img:"johnny.jpg",page:"johnny.html"},
  {name:"Hangokra várva",price:8000,img:"hangokravarva.jpg",page:"hangokravarva.html"},
  {name:"Rég múlt pillanat",price:5000,img:"regmultpillanat.jpg",page:"regmultpillanat.html"},
  {name:"Színek alkonya",price:2500,img:"szinekalkonya.jpg",page:"szinekalkonya.html"},
  {name:"Esti melódia",price:8000,img:"estimelodia.jpg",page:"estimelodia.html"},
  {name:"The jazz is freedom",price:7000,img:"thejazzisfreedom.jpg",page:"thejazzisfreedom.html"},
  {name:"A szív dala",price:3000,img:"szivdala.jpg",page:"szivdala.html"},
  {name:"Nemes hűség",price:4000,img:"nemeshuseg.jpg",page:"nemeshuseg.html"},
  {name:"Morning Cat",price:3500,img:"morningcat.jpg",page:"morningcat.html"},
  {name:"Lidokain",price:3000,img:"lidokain.jpg",page:"lidokain.html"},
  {name:"Idő árnyéka",price:2000,img:"idoarnyeka.jpg",page:"idoarnyeka.html"},
  {name:"Sarki fény",price:4000,img:"sarkifeny.jpg",page:"sarkifeny.html"},
  {name:"Őszi fények",price:3000,img:"oszifenyek.jpg",page:"oszifenyek.html"},
  {name:"Holdfényes hegyek",price:3000,img:"holdfenyeshegyek.jpg",page:"holdfenyeshegyek.html"},
  {name:"Vöröslő űr",price:3000,img:"voroslour.jpg",page:"voroslour.html"},
  {name:"Átjáró",price:2000,img:"atjaro.jpg",page:"atjaro.html"},
  {name:"Tűz és hamu",price:2000,img:"tuzeshamu.jpg",page:"tuzeshamu.html"},
  {name:"Kezdetek",price:2000,img:"kezdetek.jpg",page:"kezdetek.html"},
  {name:"Elviselés",price:4000,img:"elviseles.jpg",page:"elviseles.html"}

];

let cart = [];

/* ===== MENÜ ===== */

function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
}

/* ===== KOSÁR ===== */

function toggleCart(){
  document.getElementById("cartDrawer").classList.toggle("open");
  document.getElementById("cartOverlay").classList.toggle("show");
}

/* ===== GALÉRIA ===== */

function renderGallery(){

  const gallery = document.getElementById("gallery");

  products.forEach(p=>{

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <a href="${p.page}">
        <img src="${p.img}">
        <h3>${p.name}</h3>
      </a>

      <button class="buy-btn"
      onclick="addToCart('${p.name}', ${p.price})">
      Kosárba
      </button>
    `;

    gallery.appendChild(div);

  });

}

/* ===== KOSÁRBA ===== */

function addToCart(name,price){

  if(cart.find(i=>i.name===name)){
    return;
  }

  cart.push({name,price});

  renderCart();
  updateCartCount();

}

/* ===== TÖRLÉS ===== */

function removeItem(name){

  cart = cart.filter(i=>i.name!==name);

  renderCart();
  updateCartCount();

}

/* ===== KOSÁR RENDER ===== */

function renderCart(){

  const box = document.getElementById("cartItems");

  box.innerHTML = "";

  let total = 0;

  cart.forEach(i=>{

    const div = document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <div class="cart-left">
        <span class="cart-name">${i.name}</span>
        <span class="cart-price">${i.price} Ft</span>
      </div>

      <span class="remove"
      onclick="removeItem('${i.name}')">
      ✕
      </span>

    `;

    box.appendChild(div);

    total += i.price;

  });

  updateTotal(total);

}

/* ===== ÖSSZEG ===== */

function updateTotal(productTotal){

  let shipping =
  parseInt(document.getElementById("shipping").value) || 0;

  document.getElementById("total").innerText =
  "Összesen: " + (productTotal + shipping) + " Ft";

}

/* ===== SZÁMLÁLÓ ===== */

function updateCartCount(){

  document.getElementById("cartCount").innerText =
  cart.length;

}

/* ===== CHECKOUT ===== */

function checkout(){

  if(cart.length===0){
    alert("A kosár üres.");
    return;
  }

  if(document.getElementById("shipping").value==="0"){
    alert("Válassz szállítási módot.");
    return;
  }

  alert("A Stripe fizetés következő lépése ide kerül.");

}

/* ===== START ===== */

renderGallery();

</script>

</body>
</html>
