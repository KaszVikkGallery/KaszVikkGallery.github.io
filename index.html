<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Kasz Vikk – Galéria</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
}

/* MENÜ */
.menu-button {
  position: fixed;
  top: 20px;
  right: 25px;
  font-size: 60px;
  cursor: pointer;
  z-index: 2000;
}

nav {
  position: fixed;
  top: 0;
  right: -320px;
  width: 320px;
  height: 100%;
  background: #fff;
  border-left: 1px solid #ddd;
  padding-top: 100px;
  transition: 0.3s;
}

nav.open { right: 0; }

nav a {
  display: block;
  padding: 20px;
  font-size: 22px;
  text-decoration: none;
  color: #222;
}

/* HEADER */
header {
  text-align: center;
  padding: 120px 20px 20px;
}

header h1 {
  font-size: 40px;
}

/* GALÉRIA */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 35px;
  padding: 40px;
}

.item {
  text-align: center;
}

.item img {
  width: 100%;
  max-width: 420px;
  height: 280px;
  object-fit: cover;
}

/* KOSÁR (LIBRI STÍLUS) */
#cartBox {
  position: fixed;
  left: 20px;
  top: 120px;
  width: 320px;
  background: #fff;
  border: 1px solid #ddd;
  padding: 15px;
  border-radius: 10px;
  font-size: 16px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

.remove {
  cursor: pointer;
  color: red;
}

button {
  padding: 10px 14px;
  cursor: pointer;
}

select {
  width: 100%;
  margin-top: 8px;
}

#checkoutBtn {
  margin-top: 10px;
  width: 100%;
  background: black;
  color: white;
}
</style>
</head>

<body>

<div class="menu-button" onclick="toggleMenu()">☰</div>

<nav id="menu">
  <a href="index.html">Galéria</a>
  <a href="kapcsolat.html">Kapcsolat</a>
</nav>

<header>
  <h1>Kasz Vikk Webshop</h1>
</header>

<!-- KOSÁR -->
<div id="cartBox">
  <h3>Kosár</h3>
  <div id="cartItems"></div>

  <p>
    Szállítás:
    <select id="shipping" onchange="updateTotal()">
      <option value="0">Válassz</option>
      <option value="1699">Foxpost</option>
      <option value="1490">Packeta</option>
    </select>
  </p>

  <p id="total">Összesen: 0 Ft</p>

  <button id="checkoutBtn" onclick="checkout()">Fizetés</button>
</div>

<!-- GALÉRIA -->
<section class="gallery" id="gallery"></section>

<script>

const products = [
  {name:"Bor",price:3500,img:"bor.jpg"},
  {name:"Fanyar pillanat",price:3500,img:"fanyarpillanat.jpg"},
  {name:"Johnny Bravo",price:3500,img:"johnny.jpg"},
  {name:"Hangokra várva",price:3500,img:"hangokravarva.jpg"},
  {name:"Rég múlt pillanat",price:3500,img:"regmultpillanat.jpg"},
  {name:"Színek alkonya",price:3500,img:"szinekalkonya.jpg"},
  {name:"Esti melódia",price:3500,img:"estimelodia.jpg"},
  {name:"The jazz is freedom",price:3500,img:"thejazzisfreedom.jpg"},
  {name:"A szív dala",price:3500,img:"szivdala.jpg"},
  {name:"Nemes hűség",price:3500,img:"nemeshuseg.jpg"},
  {name:"Morning Cat",price:3500,img:"morningcat.jpg"},
  {name:"Lidokain",price:3500,img:"lidokain.jpg"},
  {name:"Idő árnyéka",price:3500,img:"idoarnyeka.jpg"},
  {name:"Sarki fény",price:3500,img:"sarkifeny.jpg"},
  {name:"Őszi fények",price:3500,img:"oszifenyek.jpg"},
  {name:"Holdfényes hegyek",price:3500,img:"holdfenyeshegyek.jpg"},
  {name:"Vöröslő űr",price:3500,img:"voroslour.jpg"},
  {name:"Átjáró",price:3500,img:"atjaro.jpg"},
  {name:"Tűz és hamu",price:3500,img:"tuzeshamu.jpg"},
  {name:"Kezdetek",price:3500,img:"kezdetek.jpg"},
  {name:"Elviselés",price:3500,img:"elviseles.jpg"}
];

let cart = [];

function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
}

function renderGallery(){
  const g = document.getElementById("gallery");

  products.forEach(p=>{
    const div = document.createElement("div");
    div.className="item";

    div.innerHTML=`
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <button onclick="addToCart('${p.name}',${p.price})">Kosárba</button>
    `;

    g.appendChild(div);
  });
}

function addToCart(name, price){

  // DUPLIKÁCIÓ TILTÁS
  if(cart.find(i=>i.name===name)){
    alert("Ez már a kosárban van!");
    return;
  }

  cart.push({name,price});
  renderCart();
}

function removeItem(name){
  cart = cart.filter(i=>i.name!==name);
  renderCart();
}

function renderCart(){

  let box = document.getElementById("cartItems");
  box.innerHTML="";

  let total = 0;

  cart.forEach(i=>{
    let div = document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`
      <span>${i.name} - ${i.price} Ft</span>
      <span class="remove" onclick="removeItem('${i.name}')">X</span>
    `;
    box.appendChild(div);
    total+=i.price;
  });

  updateTotal(total);
}

function updateTotal(productTotal){

  let ship = parseInt(document.getElementById("shipping").value)||0;

  if(productTotal===undefined){
    productTotal = cart.reduce((a,b)=>a+b.price,0);
  }

  document.getElementById("total").innerText =
    "Összesen: " + (productTotal + ship) + " Ft";
}

function checkout(){

  if(cart.length===0){
    alert("Kosár üres!");
    return;
  }

  if(document.getElementById("shipping").value==0){
    alert("Válassz szállítást!");
    return;
  }

  let total = cart.reduce((a,b)=>a+b.price,0);
  total += parseInt(document.getElementById("shipping").value);

  alert("Fizetés indítása: " + total + " Ft");

  // IDE JÖN STRIPE CHECKOUT
}

renderGallery();

</script>

</body>
</html>
