<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>KaszVikk Galéria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #ffffff;
      color: #222;
    }
    header {
      text-align: center;
      padding: 40px 20px;
    }
    header h1 {
      margin-bottom: 10px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .item {
      text-align: center;
    }
    .item img {
      width: 100%;
      height: auto;
    }
    .item h3 {
      margin-top: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<header>
  <h1>KaszVikk</h1>
  <p>Festmények</p>
  <p>Email: karloszdzseszi@gmail.com</p>
</header>

<section class="gallery">
  <div class="item">
    <img src="nemeshuseg.jpg">
    <h3>Nemes hűség</h3>
  </div>
  <div class="item">
    <img src="szivdala.jpg">
    <h3>A szív dala</h3>
  </div>
   <div class="item">
    <img src="lidokain.jpg">
    <h3>Lidokain</h3>
  </div>
</section>

</body>
</html>
