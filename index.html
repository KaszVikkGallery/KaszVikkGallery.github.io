<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasz Vikk – Galéria</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111;
color:#f5f5f5;
font-family:'Inter',sans-serif;
}

a{
text-decoration:none;
color:inherit;
}

/* Menü */

.menu-button{
position:fixed;
top:20px;
right:25px;
font-size:32px;
cursor:pointer;
z-index:5000;
color:white;
}

nav{
position:fixed;
top:0;
right:-320px;
width:280px;
height:100%;
background:#1a1a1a;
padding-top:100px;
transition:.3s;
z-index:4000;
box-shadow:-5px 0 30px rgba(0,0,0,.5);
}

nav.open{
right:0;
}

nav a{
display:block;
padding:22px 30px;
font-size:18px;
color:#eee;
}

nav a:hover{
background:#242424;
}

/* Hero */

.hero{
height:90vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.7)),
url("hangokravarva.jpg");
background-size:cover;
background-position:center;
}

.hero-content h1{
font-family:'Playfair Display',serif;
font-size:clamp(3rem,8vw,5.5rem);
letter-spacing:2px;
margin-bottom:15px;
}

.hero-content p{
font-size:1.2rem;
color:#ddd;
max-width:650px;
margin:auto;
}

.scroll-btn{
display:inline-block;
margin-top:35px;
padding:14px 30px;
border:1px solid #d4af37;
color:#d4af37;
transition:.3s;
}

.scroll-btn:hover{
background:#d4af37;
color:#111;
}

/* Galéria */

.gallery-section{
padding:80px 6%;
}

.section-title{
text-align:center;
font-family:'Playfair Display',serif;
font-size:2.6rem;
margin-bottom:60px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.item{
background:#1b1b1b;
border-radius:18px;
overflow:hidden;
transition:.35s;
}

.item:hover{
transform:translateY(-8px);
}

.item img{
width:100%;
height:320px;
object-fit:cover;
display:block;
}

.item-content{
padding:18px;
text-align:center;
}

.item-content h3{
font-size:1.15rem;
font-weight:500;
}

.sold{
display:inline-block;
margin-top:12px;
padding:8px 14px;
border-radius:50px;
background:#8b1e1e;
color:white;
font-size:14px;
font-weight:bold;
}

/* Footer */

footer{
margin-top:80px;
padding:40px 20px;
text-align:center;
color:#999;
border-top:1px solid rgba(255,255,255,.08);
}

</style>
</head>

<body>

<div class="menu-button" onclick="toggleMenu()">☰</div>

<nav id="menu">
<a href="index.html">Galéria</a>
<a href="bemutatkozas.html">Bemutatkozás</a>
<a href="kapcsolat.html">Kapcsolat</a>
</nav>

<section class="hero">
<div class="hero-content">
<h1>Kasz Vikk</h1>
<p>
Eredeti akril festmények.
Hangulatok, történetek és pillanatok vásznon megörökítve.
</p>
<a href="#gallery" class="scroll-btn">Galéria megtekintése</a>
</div>
</section>

<section class="gallery-section">
<h2 class="section-title">Festmények</h2>

<div class="gallery" id="gallery"></div>
</section>

<footer>
© 2026 Kasz Vikk Galéria
</footer>

<script>

const products = [
{name:"Őrszem",img:"orszem.jpg",page:"orszem.html"},
{name:"Zöldek mámora",img:"zoldekmamora.jpg",page:"zoldekmamora.html",sold:true},
{name:"Nyolc karú",img:"nyolckaru.jpg",page:"nyolckaru.html"},
{name:"Néma vonal",img:"nemavonal.jpg",page:"nemavonal.html"},
{name:"Bor",img:"bor.jpg",page:"bor.html"},
{name:"Fanyar pillanat",img:"fanyarpillanat.jpg",page:"fanyarpillanat.html"},
{name:"Johnny Bravo",img:"johnny.jpg",page:"johnny.html",sold:true},
{name:"Hangokra várva",img:"hangokravarva.jpg",page:"hangokravarva.html"},
{name:"Rég múlt pillanat",img:"regmultpillanat.jpg",page:"regmultpillanat.html"},
{name:"Színek alkonya",img:"szinekalkonya.jpg",page:"szinekalkonya.html"},
{name:"Esti melódia",img:"estimelodia.jpg",page:"estimelodia.html"},
{name:"The jazz is freedom",img:"thejazzisfreedom.jpg",page:"thejazzisfreedom.html"},
{name:"A szív dala",img:"szivdala.jpg",page:"aszivdala.html"},
{name:"Nemes hűség",img:"nemeshuseg.jpg",page:"nemeshuseg.html",sold:true},
{name:"Morning Cat",img:"morningcat.jpg",page:"morningcat.html",sold:true},
{name:"Lidokain",img:"lidokain.jpg",page:"lidokain.html"},
{name:"Idő árnyéka",img:"idoarnyeka.jpg",page:"idoarnyeka.html"},
{name:"Sarki fény",img:"sarkifeny.jpg",page:"sarkifeny.html"},
{name:"Őszi fények",img:"oszifenyek.jpg",page:"oszifenyek.html"},
{name:"Holdfényes hegyek",img:"holdfenyeshegyek.jpg",page:"holdfenyeshegyek.html"},
{name:"Vöröslő űr",img:"voroslour.jpg",page:"voroslour.html"},
{name:"Átjáró",img:"atjaro.jpg",page:"atjaro.html"},
{name:"Tűz és hamu",img:"tuzeshamu.jpg",page:"tuzeshamu.html"},
{name:"Kezdetek",img:"kezdetek.jpg",page:"kezdetek.html"},
{name:"Elviselés",img:"elviseles.jpg",page:"elviseles.html"}
];

function toggleMenu(){
document.getElementById("menu").classList.toggle("open");
}

function renderGallery(){

const gallery = document.getElementById("gallery");

products.forEach(p=>{

const div = document.createElement("div");

div.className = "item";

div.innerHTML = `
<a href="${p.page}">
<img src="${p.img}" alt="${p.name}">
<div class="item-content">
<h3>${p.name}</h3>
${p.sold ? '<div class="sold">ELKELT</div>' : ''}
</div>
</a>
`;

gallery.appendChild(div);

});

}

renderGallery();

</script>

</body>
</html>
