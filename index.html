<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>KaszVikk Galéria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #ffffff;
      color: #222;
    }

    /* ===== MENÜ ===== */
    .menu-button {
      font-size: 60px;
      cursor: pointer;
      user-select: none;
    }

    nav {
      position: fixed;
      top: 0;
      right: -260px;
      width: 260px;
      height: 100%;
      background: #fff;
      border-left: 1px solid #ddd;
      padding-top: 80px;
      transition: right 0.3s ease;
      z-index: 1000;
    }

    nav a {
      display: block;
      padding: 22px 30px;
      font-size: 35px;
      color: #222;
      text-decoration: none;
    }

    nav a:hover {
      background: #f2f2f2;
    }

    nav.open {
      right: 0;
    }

    /* ===== TARTALOM ===== */
    .container {
      max-width: 1000px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
    }

    .contact-text {
      font-size: 40px; /* nagy szöveg */
      line-height: 1.7;
      max-width: 800px;
      margin: 30px auto;
    }

    .email-link {
      font-size: 50px; /* email kiemelve és nagy */
      font-weight: bold;
      color: #222;
      text-decoration: none;
    }

    .email-link:hover {
      color: #0077cc;
      text-decoration: underline;

    /* Header */
    header {
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      margin-bottom: 10px;
      font-size: 36px;
    }

    header p {
      font-size: 18px;
      margin: 6px 0;
    }

    /* Galéria */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      padding: 30px;
      justify-items: center;
    }

    .item {
      text-align: center;
    }

    .item a {
      text-decoration: none;
      color: inherit;
    }

    .item img {
      width: 100%;
      max-width: 420px;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .item h3 {
      margin-top: 12px;
      font-size: 32px;
      font-weight: normal;
    }
  </style>
</head>
