<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>KaszVikk Galéria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #ffffff;
      color: #222;
    }

    /* Menü stílus */
    .menu-bar {
      position: relative;
      text-align: right;
      padding: 20px;
      background: #f5f5f5;
      border-bottom: 2px solid #ccc;
    }

    .menu-toggle {
      font-size: 50px;       /* nagy ☰ jel */
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
      padding: 10px 20px;
    }

    #menu {
      display: none;
      position: absolute;
      right: 0;
      top: 60px;
      background: #fff;
      border: 2px solid #ccc;
      padding: 15px 25px;
      border-radius: 8px;
      z-index: 1000;
    }

    #menu a {
      display: block;
      margin: 10px 0;
      font-size: 28px;    /* nagy menü szöveg */
      font-weight: bold;
      color: #222;
      text-decoration: none;
    }

    /* Header */
    header {
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      margin-bottom: 10px;
      font-size: 36px;
    }

    header p {
      font-size: 18px;
      margin: 6px 0;
    }

    /* Galéria */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      padding: 30px;
      justify-items: center;
    }

    .item {
      text-align: center;
    }

    .item a {
      text-decoration: none;
      color: inherit;
    }

    .item img {
      width: 100%;
      max-width: 420px;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .item h3 {
      margin-top: 12px;
      font-size: 22px;
      font-weight: normal;
    }
  </style>
</head>
