    body {

      margin: 0;
      background: #ffffff;
      color: #222;
    }
    header {
      text-align: center;
      padding: 40px 20px;
    }
    header h1 {
      margin-bottom: 10px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .item {

    }
    .item img {
      width: 100%;
      height: auto;
    }
    .item h3 {
      margin-top: 8px;
      font-size: 16px;
    }
  </style>
</head>
