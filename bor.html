<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bor – Kasz Vikk</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#fff;
  color:#222;
}

/* ===== KOSÁR ===== */

#cartBtn{
  position:fixed;
  top:20px;
  left:20px;
  background:black;
  color:white;
  padding:14px 18px;
  font-size:20px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  z-index:2000;
}

#cartCount{
  background:red;
  padding:5px 10px;
  border-radius:50%;
  margin-left:8px;
}

/* ===== KÉP ===== */

h1{
  font-size:38px;
  margin-top:100px;
}

.main-image{
  max-width:80%;
  margin-top:20px;
  cursor:zoom-in;
}

/* ===== SZÖVEG ===== */

p{
  font-size:26px;
  margin:10px auto;
  max-width:800px;
}

/* ===== GOMB ===== */

button{
  font-size:20px;
  padding:14px 20px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

#lightbox img{
  max-width:95%;
  max-height:95%;
}

/* ===== NYILAK ===== */

.controls button{
  margin:10px;
  font-size:22px;
  padding:12px 18px;
}

</style>
</head>

<body>

<!-- KOSÁR -->
<button id="cartBtn" onclick="openCart()">
🛒 <span id="cartCount">0</span>
</button>

<h1>Bor</h1>

<img class="main-image" src="bor.jpg" onclick="openLightbox()">

<div class="controls">
  <button onclick="prev()">◀</button>
  <button onclick="next()">▶</button>
</div>

<p>Lakkozott csendélet festmény.</p>
<p>Technika: Akril</p>
<p>Méret: 10 × 25 cm</p>
<p>Ára: 3500 Ft</p>

<button onclick="addToCart()">Kosárba</button>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<script>

/* ===== KÉPEK ===== */

const images = [
  "bor.jpg",
  "bormessze.jpg",
  "boroldal.jpg",
  "borközeloldal.jpg",
  "borhat.jpg"
];

let current = 0;

/* ===== LIGHTBOX ===== */

function openLightbox(){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightboxImg").src = images[current];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

/* ===== LAPOZÁS ===== */

function next(){
  current = (current + 1) % images.length;
  document.querySelector(".main-image").src = images[current];
}

function prev(){
  current = (current - 1 + images.length) % images.length;
  document.querySelector(".main-image").src = images[current];
}

/* ===== KOSÁR (KÖZÖS) ===== */

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCart();
}

function addToCart(){

  if(!cart.find(i=>i.name==="Bor")){
    cart.push({name:"Bor",price:3500});
    saveCart();
  }

}

function updateCart(){
  document.getElementById("cartCount").innerText = cart.length;
}

function openCart(){
  alert(
    "Kosár:\n\n" +
    cart.map(i=>i.name + " - " + i.price + " Ft").join("\n")
  );
}

updateCart();

</script>

</body>
</html>
