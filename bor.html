<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bor – Kasz Vikk</title>

<style>

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#fff;
  color:#222;
  text-align:center;
}

/* ===== MENÜ ===== */

.menu-button{
  position:fixed;
  top:20px;
  right:20px;
  font-size:70px;
  cursor:pointer;
  z-index:3000;
}

nav{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#fff;
  padding-top:100px;
  transition:0.3s;
  z-index:2500;
}

nav.open{ right:0; }

nav a{
  display:block;
  padding:22px;
  font-size:30px;
  text-decoration:none;
  color:#222;
}

/* ===== KOSÁR GOMB ===== */

#openCart{
  position:fixed;
  top:20px;
  left:20px;
  background:black;
  color:white;
  padding:14px 18px;
  font-size:20px;
  border:none;
  cursor:pointer;
  border-radius:12px;
  z-index:3000;
}

#cartCount{
  background:red;
  padding:5px 10px;
  border-radius:50%;
  margin-left:8px;
}

/* ===== KÉP ===== */

.main-image{
  max-width:80%;
  margin-top:120px;
  cursor:zoom-in;
}

/* ===== SZÖVEG ===== */

p{
  font-size:28px;
  max-width:800px;
  margin:12px auto;
}

h1{
  font-size:38px;
  margin-top:110px;
}

/* ===== GOMB ===== */

button{
  font-size:20px;
  padding:14px 22px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

#lightbox img{
  max-width:95%;
  max-height:95%;
}

.controls button{
  margin:10px;
}

</style>
</head>

<body>

<!-- MENU -->
<div class="menu-button" onclick="toggleMenu()">☰</div>

<nav id="menu">
  <a href="index.html">Galéria</a>
  <a href="bemutatkozas.html">Bemutatkozás</a>
  <a href="szallitas.html">Szállítás</a>
  <a href="kapcsolat.html">Kapcsolat</a>
</nav>

<!-- KOSÁR -->
<button id="openCart" onclick="toggleCart()">
🛒 <span id="cartCount">0</span>
</button>

<h1>Bor</h1>

<img class="main-image" src="bor.jpg" onclick="openLightbox()">

<div class="controls">
  <button onclick="prevImage()">◀</button>
  <button onclick="nextImage()">▶</button>
</div>

<p>Lakkozott csendélet festmény.</p>
<p>Technika: Akril</p>
<p>Méret: 10 × 25 cm</p>
<p>Ára: 3500 Ft</p>

<button onclick="addToCart()">Kosárba</button>

<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
</div>

<script>

/* ===== KÉPEK ===== */

const images = [
  "bor.jpg",
  "bormessze.jpg",
  "boroldal.jpg",
  "borközeloldal.jpg",
  "borhat.jpg"
];

let current = 0;

/* ===== LIGHTBOX ===== */

function openLightbox(){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightbox-img").src=images[current];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

/* ===== LAPOZÁS ===== */

function nextImage(){
  current=(current+1)%images.length;
  document.querySelector(".main-image").src=images[current];
}

function prevImage(){
  current=(current-1+images.length)%images.length;
  document.querySelector(".main-image").src=images[current];
}

/* ===== KOSÁR (KÖZÖS) ===== */

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCart();
}

function addToCart(){

  if(!cart.find(i=>i.name==="Bor")){
    cart.push({name:"Bor",price:3500});
    saveCart();
  }

}

function updateCart(){
  document.getElementById("cartCount").innerText = cart.length;
}

/* ===== INIT ===== */

updateCart();

function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
}

</script>

</body>
</html>
