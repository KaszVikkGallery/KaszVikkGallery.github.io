<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bor – Kasz Vikk</title>

<style>

body{
  font-family:Arial,sans-serif;
  margin:20px;
  background:#fff;
  color:#222;
  text-align:center;
}

/* ===== CÍM ===== */

h1{
  font-size:42px;
  margin-bottom:25px;
}

/* ===== KÉP ===== */

.image-container{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}

.main-image{
  max-width:90%;
  cursor:zoom-in;
  border-radius:10px;
}

/* ===== KONTROL ===== */

.controls{
  margin:25px 0;
}

.controls button{
  font-size:22px;
  padding:14px 26px;
  margin:10px;
  cursor:pointer;
}

/* ===== SZÖVEG ===== */

p{
  font-size:28px;
  line-height:1.7;
  max-width:900px;
  margin:14px auto;
}

/* ===== KOSÁR GOMB ===== */

.buy-button{
  display:inline-block;
  padding:14px 28px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  font-size:20px;
  margin-top:20px;
  cursor:pointer;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.92);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
  flex-direction:column;
}

#lightbox img{
  max-width:95%;
  max-height:85%;
  border-radius:10px;
}

/* ===== LIGHTBOX GOMBOK ===== */

.lb-controls{
  margin-top:15px;
}

.lb-controls button{
  font-size:28px;
  padding:10px 18px;
  margin:0 10px;
  cursor:pointer;
  background:white;
  border:none;
  border-radius:8px;
}

.close-btn{
  position:absolute;
  top:20px;
  right:25px;
  font-size:40px;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<h1>Bor</h1>

<div class="image-container">
  <img id="mainImage" class="main-image" src="bor.jpg" onclick="openLightbox()">
</div>

<div class="controls">
  <button onclick="prevImage()">◀ Előző</button>
  <button onclick="nextImage()">Következő ▶</button>
  <button onclick="window.location.href='index.html'">Vissza</button>
</div>

<p>Lakkozott és keretezett csendélet bor.</p>
<p>Technika: Akril</p>
<p>Vászon típus: Farostlemez</p>
<p>Méret: 10 × 25 cm</p>
<p>Ára: 3 500 Ft</p>

<button class="buy-button" onclick="addToCart('Bor',3500)">
Kosárba
</button>

<!-- LIGHTBOX -->
<div id="lightbox">

  <div class="close-btn" onclick="closeLightbox()">✕</div>

  <img id="lightbox-img">

  <div class="lb-controls">
    <button onclick="lbPrev()">◀</button>
    <button onclick="lbNext()">▶</button>
  </div>

</div>

<script>

const images = [
  "bor.jpg",
  "bormessze.jpg",
  "boroldal.jpg",
  "borközeloldal.jpg",
  "borhat.jpg"
];

let current = 0;

/* ===== FŐ KÉP ===== */

function showImage(){
  document.getElementById("mainImage").src = images[current];
}

/* ===== LAPOZÁS ===== */

function nextImage(){
  current = (current + 1) % images.length;
  showImage();
}

function prevImage(){
  current = (current - 1 + images.length) % images.length;
  showImage();
}

/* ===== LIGHTBOX ===== */

function openLightbox(){
  document.getElementById("lightbox-img").src = images[current];
  document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox(){
  document.getElementById("lightbox").style.display = "none";
}

/* ===== LIGHTBOX LAPOZÁS ===== */

function lbNext(){
  current = (current + 1) % images.length;
  document.getElementById("lightbox-img").src = images[current];
  showImage();
}

function lbPrev(){
  current = (current - 1 + images.length) % images.length;
  document.getElementById("lightbox-img").src = images[current];
  showImage();
}

/* ===== BILLENTYŰ ===== */

document.addEventListener("keydown", function(e){

  if(document.getElementById("lightbox").style.display === "flex"){

    if(e.key === "ArrowRight") lbNext();
    if(e.key === "ArrowLeft") lbPrev();
    if(e.key === "Escape") closeLightbox();

  }

});

</script>

</body>
</html>
