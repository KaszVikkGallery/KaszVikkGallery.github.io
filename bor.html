<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bor – Kasz Vikk</title>

<style>

body{
  font-family:Arial,sans-serif;
  margin:14px;
  background:#fff;
  color:#222;
  text-align:center;
}

/* ===== CÍM ===== */

h1{
  font-size:34px;
  margin-bottom:18px;
}

/* ===== KÉP ===== */

.image-container{
  display:flex;
  justify-content:center;
  margin-bottom:16px;
}

.main-image{
  max-width:88%;
  cursor:zoom-in;
  border-radius:10px;
}

/* ===== GOMBOK ===== */

.controls button{
  font-size:18px;
  padding:10px 18px;
  margin:8px;
  cursor:pointer;
}

/* ===== SZÖVEG ===== */

p{
  font-size:22px;
  line-height:1.6;
  max-width:800px;
  margin:10px auto;
}

/* ===== KOSÁR GOMB ===== */

.buy-button{
  display:inline-block;
  padding:12px 22px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  font-size:18px;
  margin-top:16px;
  cursor:pointer;
}

/* ===== KOSÁR SZÁMLÁLÓ ===== */

#cartBar{
  position:fixed;
  top:14px;
  left:14px;
  background:black;
  color:white;
  padding:10px 14px;
  border-radius:12px;
  font-size:18px;
  z-index:2000;
  cursor:pointer;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.92);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

#lightbox img{
  max-width:94%;
  max-height:80%;
  border-radius:10px;
}

/* ===== LIGHTBOX GOMBOK ===== */

.lb-controls button{
  font-size:22px;
  padding:8px 14px;
  margin:6px;
}

/* ===== CLOSE ===== */

.close{
  position:absolute;
  top:16px;
  right:20px;
  font-size:34px;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- ===== KOSÁR JELZŐ ===== -->
<div id="cartBar" onclick="goToCart()">
🛒 Kosár: <span id="cartCount">0</span>
</div>

<h1>Bor</h1>

<div class="image-container">
  <img id="mainImage" class="main-image" src="bor.jpg" onclick="openLightbox()">
</div>

<div class="controls">
  <button onclick="prevImage()">◀</button>
  <button onclick="nextImage()">▶</button>
  <button onclick="window.location.href='index.html'">Vissza</button>
</div>

<p>Lakkozott és keretezett csendélet bor.</p>
<p>Technika: Akril</p>
<p>Vászon típus: Farostlemez</p>
<p>Méret: 10 × 25 cm</p>
<p>Ára: 3 500 Ft</p>

<button class="buy-button" onclick="addToCart('Bor',3500)">
Kosárba
</button>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div class="close" onclick="closeLightbox()">✕</div>

  <img id="lightbox-img">

  <div class="lb-controls">
    <button onclick="lbPrev()">◀</button>
    <button onclick="lbNext()">▶</button>
  </div>
</div>

<script>

const images=[
  "bor.jpg",
  "bormessze.jpg",
  "boroldal.jpg",
  "borközeloldal.jpg",
  "borhat.jpg"
];

let current=0;

/* ===== KOSÁR (GLOBAL) ===== */

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function updateCartUI(){
  document.getElementById("cartCount").innerText = cart.length;
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name,price){

  if(cart.find(i=>i.name===name)) return;

  cart.push({name,price});
  updateCartUI();
}

/* ===== LIGHTBOX ===== */

function show(){
  document.getElementById("mainImage").src=images[current];
}

function nextImage(){
  current=(current+1)%images.length;
  show();
}

function prevImage(){
  current=(current-1+images.length)%images.length;
  show();
}

function openLightbox(){
  document.getElementById("lightbox-img").src=images[current];
  document.getElementById("lightbox").style.display="flex";
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

function lbNext(){
  current=(current+1)%images.length;
  document.getElementById("lightbox-img").src=images[current];
  show();
}

function lbPrev(){
  current=(current-1+images.length)%images.length;
  document.getElementById("lightbox-img").src=images[current];
  show();
}

/* ===== KOSÁR OLDAL (későbbre) ===== */

function goToCart(){
  alert("Kosár oldal még a fő rendszeren keresztül nyílik meg.");
}

/* ===== START ===== */

updateCartUI();

</script>

</body>
</html>
