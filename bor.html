<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bor – Kasz Vikk</title>

<style>

body{
  font-family:Arial,sans-serif;
  margin:14px;
  background:#fff;
  color:#222;
  text-align:center;
}

/* ===== CÍM ===== */

h1{
  font-size:34px;
  margin-bottom:18px;
}

/* ===== KÉP ===== */

.image-container{
  display:flex;
  justify-content:center;
  margin-bottom:16px;
}

.main-image{
  max-width:88%;
  border-radius:10px;
  cursor:zoom-in;
}

/* ===== SZÖVEG ===== */

p{
  font-size:22px;
  line-height:1.6;
  max-width:800px;
  margin:10px auto;
}

/* ===== GOMB ===== */

button{
  border:none;
  cursor:pointer;
}

/* ===== KOSÁR BADGE ===== */

#cartBar{
  position:fixed;
  top:14px;
  left:14px;
  background:black;
  color:white;
  padding:10px 14px;
  border-radius:14px;
  font-size:18px;
  cursor:pointer;
  z-index:2000;
}

#cartCount{
  background:red;
  color:white;
  border-radius:50%;
  padding:6px 12px;
  margin-left:8px;
  font-size:16px;
}

/* ===== BUY ===== */

.buy-button{
  background:black;
  color:white;
  padding:12px 22px;
  font-size:18px;
  border-radius:10px;
  margin-top:16px;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.92);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

#lightbox img{
  max-width:94%;
  max-height:80%;
  border-radius:10px;
}

.lb-controls button{
  font-size:22px;
  padding:8px 14px;
  margin:6px;
}

/* ===== KOSÁR DRAWER ===== */

#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.3);
  display:none;
  z-index:2500;
}

#overlay.show{
  display:block;
}

#cartDrawer{
  position:fixed;
  top:0;
  right:-420px;
  width:360px;
  height:100%;
  background:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,0.15);
  transition:0.3s;
  z-index:3000;
  padding:20px;
  overflow-y:auto;
}

#cartDrawer.open{
  right:0;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
  font-size:18px;
}

.remove{
  color:red;
  cursor:pointer;
}

#total{
  font-weight:bold;
  margin-top:10px;
}

</style>
</head>

<body>

<!-- ===== KOSÁR ===== -->
<div id="cartBar" onclick="toggleCart()">
🛒 <span id="cartCount">0</span>
</div>

<h1>Bor</h1>

<div class="image-container">
  <img id="mainImage" src="bor.jpg" onclick="openLightbox()">
</div>

<p>Lakkozott és keretezett csendélet bor.</p>
<p>Technika: Akril</p>
<p>Méret: 10 × 25 cm</p>
<p>Ára: 3 500 Ft</p>

<button class="buy-button" onclick="addToCart('Bor',3500)">
Kosárba
</button>

<!-- ===== KOSÁR ===== -->
<div id="overlay" onclick="toggleCart()"></div>

<div id="cartDrawer">
  <h2>Kosár</h2>
  <div id="cartItems"></div>
</div>

<!-- ===== LIGHTBOX ===== -->
<div id="lightbox">
  <img id="lightbox-img">

  <div class="lb-controls">
    <button onclick="lbPrev()">◀</button>
    <button onclick="lbNext()">▶</button>
  </div>
</div>

<script>

const images=[
  "bor.jpg",
  "bormessze.jpg",
  "boroldal.jpg",
  "borközeloldal.jpg",
  "borhat.jpg"
];

let current=0;

/* ===== KÖZÖS KOSÁR (GLOBAL) ===== */

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name,price){

  if(cart.find(i=>i.name===name)) return;

  cart.push({name,price});
  saveCart();
  updateCartUI();
}

function updateCartUI(){

  document.getElementById("cartCount").innerText = cart.length;

  renderCart();
}

/* ===== KOSÁR MEGJELENÍTÉS ===== */

function toggleCart(){
  document.getElementById("cartDrawer").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function renderCart(){

  let box=document.getElementById("cartItems");
  box.innerHTML="";

  cart.forEach(i=>{

    let div=document.createElement("div");
    div.className="cart-item";

    div.innerHTML=`
      <span>${i.name}</span>
      <span>${i.price} Ft</span>
    `;

    box.appendChild(div);

  });

}

/* ===== LIGHTBOX ===== */

function openLightbox(){
  document.getElementById("lightbox-img").src=images[current];
  document.getElementById("lightbox").style.display="flex";
}

function lbNext(){
  current=(current+1)%images.length;
  document.getElementById("lightbox-img").src=images[current];
}

function lbPrev(){
  current=(current-1+images.length)%images.length;
  document.getElementById("lightbox-img").src=images[current];
}

updateCartUI();

</script>

</body>
</html>
