<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Vöröslő űr – Kasz Vikk</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #fff;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 25px;
    }

    .image-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .main-image {
      max-width: 90%;
      cursor: zoom-in;
    }

    .controls {
      margin: 25px 0;
    }

    .controls button {
      font-size: 26px;
      padding: 16px 32px;
      margin: 0 20px;
      cursor: pointer;
    }

    p {
      font-size: 26px;
      line-height: 1.7;
      max-width: 900px;
      margin: 20px auto;
    }

    a {
      font-size: 22px;
      display: inline-block;
      margin-top: 30px;
    }

    /* LIGHTBOX */
    #lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #lightbox img {
      max-width: 95%;
      max-height: 95%;
    }
  </style>
</head>

<body>

  <h1>Vöröslő űr</h1>

  <div class="image-container">
    <img id="mainImage" class="main-image" src="voroslourmessze.jpg" onclick="openLightbox()">
  </div>

  <div class="controls">
    <button onclick="prevImage()">◀ Előző</button>
    <button onclick="nextImage()">Következő ▶</button>
  </div>

  <p></p>
  <p>Technika: Akril</p>
  <p>Vászon típus: Feszített vászon<p>
  <p>Méret: 20 × 20 cm</p>
  <p>Ára: 3 000 Forint</p>

  <a href="index.html">Vissza a galériához</a>

  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
  </div>

  <script>
    const images = [
      "voroslourmessze.jpg",
      "voroslourjobb.jpg",
      "voroslourbal.jpg"
    ];

    let current = 0;

    function showImage() {
      document.getElementById("mainImage").src = images[current];
    }

    function nextImage() {
      current = (current + 1) % images.length;
      showImage();
    }

    function prevImage() {
      current = (current - 1 + images.length) % images.length;
      showImage();
    }

    function openLightbox() {
      document.getElementById("lightbox-img").src = images[current];
      document.getElementById("lightbox").style.display = "flex";
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }
  </script>

</body>
</html>
