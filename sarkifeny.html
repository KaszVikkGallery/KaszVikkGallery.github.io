<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarki fény – Kasz Vikk</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#fff;
  color:#222;
}

/* ===== CÍM ===== */

h1{
  font-size:34px;
  margin-top:90px;
}

/* ===== KÉP ===== */

.main-image{
  max-width:80%;
  margin-top:20px;
  cursor:zoom-in;
}

/* ===== SZÖVEG ===== */

p{
  font-size:22px;
  margin:10px auto;
  max-width:800px;
}

/* ===== GOMB ===== */

button{
  font-size:18px;
  padding:12px 18px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

/* ===== VISSZA ===== */

.back-button{
  font-size:18px;
  padding:12px 18px;
  background:#f2f2f2;
  color:#222;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:20px;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#lightbox img{
  max-width:95%;
  max-height:95%;
}

</style>
</head>

<body>

<h1>Sarki fény</h1>

<img id="mainImage" class="main-image" src="sarkifenymessze.jpg" onclick="openLightbox()">

<div>
  <button onclick="prev()">◀</button>
  <button onclick="next()">▶</button>
</div>

<p></p>
<p>Technika: Akril</p>
<p>Vászon típus: Feszített vászon</p>
<p>Méret: 29,7 × 21 cm</p>
<p>Ára: 4 000 Forint</p>

<button class="back-button" onclick="window.location.href='index.html'">
← Vissza a galériához
</button>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
</div>

<script>

const images = [
  "sarkifenymessze.jpg",
  "sarkifenyjobb.jpg",
  "sarkifenybal.jpg"
];

let current = 0;

function show(){
  document.getElementById("mainImage").src = images[current];
}

function next(){
  current = (current + 1) % images.length;
  show();
}

function prev(){
  current = (current - 1 + images.length) % images.length;
  show();
}

function openLightbox(){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightbox-img").src = images[current];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

</script>

</body>
</html>
