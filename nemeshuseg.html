<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Nemes hűség – Kasz Vikk</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #fff; color: #222; }
    img { max-width: 100%; height: auto; margin-bottom: 10px; display: block; }
    h1 {
  margin-bottom: 20px;
  font-size: 36px;
  text-align: center;
    }
    p {
  font-size: 26px;
  line-height: 1.7;
  max-width: 900px;
  margin: 25px auto;
}
    a { color: blue; text-decoration: underline; }
.slider {
  display: flex;
  justify-content: center;
}
.slider img {
  display: none;
  max-width: 90%;
}
.slider img.active {
  display: block;
}
    .controls {
  text-align: center;
  margin-top: 25px;
}

.controls button {
  font-size: 24px;
  padding: 14px 28px;
  margin: 0 15px;
  cursor: pointer;
}
  </style>
</head>
<body>

<h1>Nemes hűség</h1>
<div class="slider">
  <img src="nemeshusegmessze.jpg" class="active">
  <img src="nemeshusegjobb.jpg">
  <img src="nemeshusegbal.jpg">
</div>
<div class="controls">
  <button onclick="prevImage()">◀ Előző</button>
  <button onclick="nextImage()">Következő ▶</button>
</div>
<p> A "Nemes hűség" a kutya nemességét és hűségét jeleníti meg elegáns színekben. </p> 
<p> Technika:Akril </p>
<p>  Méret: 20×20cm </p>
<a href="index.html">Vissza a galériához</a>

<script>
  let current = 0;
  const images = document.querySelectorAll('.slider img');
  function showImage(index) {
    images.forEach(img => img.classList.remove('active'));
    images[index].classList.add('active');
  }
  function nextImage() {
    current = (current + 1) % images.length;
    showImage(current);
  }
  function prevImage() {
    current = (current - 1 + images.length) % images.length;
    showImage(current);
  }
</script>
  
</body>
</html>
