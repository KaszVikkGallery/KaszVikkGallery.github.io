<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Nemes hűség – Kasz Vikk</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #fff; color: #222; }
    img { max-width: 100%; height: auto; margin-bottom: 10px; display: block; }
    h1 {
  margin-bottom: 20px;
  font-size: 36px;
  text-align: center;
    }
    p {
  font-size: 26px;
  line-height: 1.7;
  max-width: 900px;
  margin: 25px auto;
}
    a { color: blue; text-decoration: underline; }
.slider {
  display: flex;
  justify-content: center;
}
.slider img {
  display: none;
  max-width: 90%;
}
.slider img.active {
  display: block;
}
    .controls {
  text-align: center;
  margin-top: 25px;
}

.controls button {
  font-size: 24px;
  padding: 14px 28px;
  margin: 0 15px;
  cursor: pointer;
}
    #lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#lightbox img {
  max-width: 95%;
  max-height: 95%;
}
  </style>
</head>
<body>

<h1>Nemes hűség</h1>
<div class="image-container">
  <img src="nemeshusegmessze.jpg" class="main-image">
</div>
 .image-container {
  display: flex;
  justify-content: center;
}
.main-image {
  max-width: 90%;
  cursor: zoom-in;
}
<p> A "Nemes hűség" a kutya nemességét és hűségét jeleníti meg elegáns színekben. </p> 
<p> Technika:Akril </p>
<p>  Méret: 20×20cm </p>
<a href="index.html">Vissza a galériához</a>

  <div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
  </div>
  
<script>
  const images = [
    "nemeshusegmessze.jpg",
    "nemeshusegjobb.jpg",
    "nemeshusegbal.jpg"
  ];

  function openLightbox(index) {
    current = index;
    document.getElementById("lightbox-img").src = images[current];
    document.getElementById("lightbox").style.display = "flex";
  }

  function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
  }
</script>
  
</body>
</html>
