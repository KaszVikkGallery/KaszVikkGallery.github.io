<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Nemes hűség – Kasz Vikk</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#fff;
  color:#222;
}

/* ===== CÍM ===== */

h1{
  font-size:34px;
  margin-top:90px;
}

/* ===== KÉP ===== */

.image-container{
  display:flex;
  justify-content:center;
}

.main-image{
  max-width:80%;
  margin-top:20px;
  cursor:zoom-in;
}

/* ===== SZÖVEG ===== */

p{
  font-size:20px;
  margin:10px auto;
  max-width:800px;
  line-height:1.4;
}

/* ===== GOMBOK ===== */

button{
  font-size:18px;
  padding:12px 18px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

.back-btn{
  margin-top:20px;
  background:#f2f2f2;
  color:#222;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
}

</style>
</head>

<body>

<h1>Nemes hűség</h1>

<div class="image-container">
  <img id="mainImage" class="main-image" src="nemeshusegmessze.jpg" onclick="openLightbox()">
</div>

<div>
  <button onclick="prevImage()">◀</button>
  <button onclick="nextImage()">▶</button>
</div>

<p>Elkelt!</p>
<p>A „Nemes hűség” a kutya nemességét és hűségét jeleníti meg elegáns színekben.</p>

<p>Technika: Akril</p>
<p>Vászon típus: Feszített vászon</p>
<p>Méret: 20 × 20 cm</p>
<p>Ár: 4 000 Forint</p>

<button class="back-btn" onclick="window.location.href='index.html'">
← Vissza a galériához
</button>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img">
</div>

<script>

const images = [
  "nemeshusegmessze.jpg",
  "nemeshusegjobb.jpg",
  "nemeshusegbal.jpg"
];

let current = 0;

function showImage(){
  document.getElementById("mainImage").src = images[current];
}

function nextImage(){
  current = (current + 1) % images.length;
  showImage();
}

function prevImage(){
  current = (current - 1 + images.length) % images.length;
  showImage();
}

function openLightbox(){
  document.getElementById("lightbox-img").src = images[current];
  document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox(){
  document.getElementById("lightbox").style.display = "none";
}

</script>

</body>
</html>
