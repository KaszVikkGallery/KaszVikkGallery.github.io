<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasz Vikk – Fizetés</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  text-align:center;
  padding:20px;
  color:#222;
}

h1{ margin-top:30px; font-size:28px; }

input, button{
  width:90%;
  max-width:420px;
  padding:14px;
  margin:8px 0;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  background:black;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover{ opacity:0.9; }

#pickup{ background:#f5f5f5; cursor:pointer; }

#summary{ margin-top:18px; font-size:20px; font-weight:bold; }

#step2{ display:none; }

.small{ font-size:13px; color:#666; margin-top:5px; }
</style>
</head>

<body>

<h1>Szállítási adatok</h1>

<div id="step1">

<input id="name" placeholder="Teljes név">
<input id="email" type="email" placeholder="Email">
<input id="phone" type="tel" placeholder="Telefonszám">

<input id="pickup" placeholder="Packeta átvételi pont" readonly onclick="openPacketa()">

<div class="small">Kattints a kiválasztáshoz</div>

<button onclick="nextStep()">Tovább</button>

</div>

<div id="step2">

<div id="summary"></div>

<button id="payBtn" onclick="pay()">Fizetés indítása</button>

</div>

<script src="https://widget.packeta.com/v6/www/js/library.js"></script>

<script>

function openPacketa(){
  Packeta.Widget.pick(
    "test",
    function(point){
      if(!point) return;
      document.getElementById("pickup").value =
        point.name + " - " + point.city;
    },
    { language:"hu", country:"hu", view:"modal" }
  );
}

function nextStep(){

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const pickup = document.getElementById("pickup").value.trim();

  if(!name || !email || !phone || !pickup){
    alert("Minden mezőt ki kell tölteni");
    return;
  }

  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  const total = parseInt(localStorage.getItem("cartTotal"), 10);

  if(cart.length === 0){
    alert("Kosár üres");
    return;
  }

  if(isNaN(total)){
    alert("Hibás kosár összeg");
    return;
  }

  const order = {
    name,
    email,
    phone,
    pickup,
    items: cart,
    amount: total   // 🔥 EZ KELL A STRIPE-NAK
  };

  localStorage.setItem("lastOrder", JSON.stringify(order));

  document.getElementById("step1").style.display = "none";
  document.getElementById("step2").style.display = "block";

  document.getElementById("summary").innerText =
    "Fizetendő: " + total.toLocaleString("hu-HU") + " Ft";
}

async function pay(){

  const btn = document.getElementById("payBtn");
  btn.disabled = true;
  btn.innerText = "Betöltés...";

  try {

    const order = JSON.parse(localStorage.getItem("lastOrder"));

    const save = await fetch(
      "https://kasz-vikk-gallery-github-io.vercel.app/api/save-order",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(order)
      }
    );

    if(!save.ok) throw new Error("Save failed");

    const stripe = await fetch(
      "https://kasz-vikk-gallery-github-io.vercel.app/api/create-checkout-session",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(order)
      }
    );

    if(!stripe.ok) throw new Error("Stripe error");

    const data = await stripe.json();

    if(data.url){
      window.location.href = data.url;
    } else {
      throw new Error("No Stripe URL");
    }

  } catch(err){
    console.error(err);
    alert("Hiba történt a fizetésnél");
    btn.disabled = false;
    btn.innerText = "Fizetés indítása";
  }
}

</script>

</body>
</html>
