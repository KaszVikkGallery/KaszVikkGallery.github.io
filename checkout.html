<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasz Vikk – Fizetés</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
padding:20px;
color:#222;
}

h1{
margin-top:30px;
font-size:32px;
}

input, button{
width:90%;
max-width:420px;
padding:14px;
margin:8px 0;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:black;
color:white;
border:none;
cursor:pointer;
}

button:hover{
opacity:0.95;
}

#pickup{
background:#f5f5f5;
}

#summary{
margin-top:18px;
font-size:22px;
font-weight:bold;
}

.small{
font-size:14px;
color:#666;
margin-top:5px;
}

</style>
</head>

<body>

<h1>Fizetés</h1>

<input id="name" placeholder="Teljes név">

<input id="email" type="email" placeholder="Email cím">

<input id="phone" placeholder="Telefonszám">

<input id="pickup" placeholder="Packeta átvételi pont" readonly>

<button onclick="openPacketa()">
Átvételi pont kiválasztása
</button>

<div class="small">
Válaszd ki a hozzád legközelebbi Packeta pontot.
</div>

<div id="summary"></div>

<button onclick="pay()">
Fizetés indítása
</button>

<script src="https://widget.packeta.com/v6/www/js/library.js"></script>

<script>

let total = parseInt(localStorage.getItem("cartTotal")) || 0;

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

function openPacketa(){

Packeta.Widget.pick(
"test",
function(point){

if(!point) return;

document.getElementById("pickup").value =
point.name + " — " + point.city;

},
{
language:"hu",
country:"hu"
}

);

}

function pay(){

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const phone = document.getElementById("phone").value.trim();
const pickup = document.getElementById("pickup").value.trim();

if(!name || !email || !phone || !pickup){
alert("Minden mezőt ki kell tölteni.");
return;
}

/* mentés */
localStorage.setItem("buyerName", name);
localStorage.setItem("buyerEmail", email);
localStorage.setItem("buyerPhone", phone);
localStorage.setItem("pickupPoint", pickup);

/* EZ A FONTOS RÉSZ */
/* Stripe-hoz előkészítés */

const data = {
amount: total,
name: name,
email: email,
phone: phone,
pickup: pickup
};

fetch("create-checkout-session", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify(data)
})
.then(res => res.json())
.then(session => {
window.location.href = session.url;
})
.catch(err => {
alert("Fizetési hiba történt.");
console.log(err);
});

}

document.addEventListener("keydown", function(e){
if(e.key === "Enter"){
pay();
}
});

</script>

</body>
</html>
