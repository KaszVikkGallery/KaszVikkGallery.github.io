<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasz Vikk – Fizetés</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
padding:20px;
}

h1{ margin-top:40px; }

input, select{
width:90%;
max-width:420px;
padding:12px;
margin:8px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:90%;
max-width:420px;
padding:14px;
margin-top:12px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:black;
color:white;
}

.secondary{
background:#eee;
color:#222;
}

#summary{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

#pickupStatus{
margin-top:10px;
font-size:14px;
color:green;
}
</style>
</head>

<body>

<h1>Fizetés</h1>

<!-- ADATOK -->
<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefonszám">

<!-- SZÁLLÍTÁS -->
<select id="shipping" onchange="openMap()">
  <option value="">Szállítás módja</option>
  <option value="foxpost">Foxpost</option>
  <option value="packeta">Packeta</option>
</select>

<!-- CSAK 1 MEZŐ -->
<input id="pickup" placeholder="Átvételi pont (válaszd a térképen)" readonly>

<button class="secondary" onclick="openMap()">
Átvételi pont kiválasztása
</button>

<div id="pickupStatus"></div>

<!-- ÖSSZEG -->
<div id="summary"></div>

<button onclick="goToStripe()">Fizetés indítása</button>

<script>

let total = localStorage.getItem("cartTotal") || 0;

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

function openMap(){

const type = document.getElementById("shipping").value;

if(!type){
alert("Válassz szállítást!");
return;
}

/* FOXPOST */
if(type === "foxpost"){
window.open("https://www.foxpost.hu/csomagautomata-kereso", "_blank");

/* ide kézzel visszajön az érték (egyelőre workaround) */
setTimeout(()=>{
let val = prompt("Másold be a kiválasztott Foxpost automata nevét:");
if(val){
document.getElementById("pickup").value = val;
document.getElementById("pickupStatus").innerText = "✔ Foxpost kiválasztva";
}
}, 1000);
}

/* PACKETA */
if(type === "packeta"){
window.open("https://www.packeta.hu/atvevohelyek", "_blank");

setTimeout(()=>{
let val = prompt("Másold be a kiválasztott Packeta pont nevét:");
if(val){
document.getElementById("pickup").value = val;
document.getElementById("pickupStatus").innerText = "✔ Packeta kiválasztva";
}
}, 1000);
}

}

function goToStripe(){

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;
const shipping = document.getElementById("shipping").value;
const pickup = document.getElementById("pickup").value;

if(!name || !email || !phone || !shipping || !pickup){
alert("Minden mezőt tölts ki!");
return;
}

alert("Stripe fizetés indul");

}

</script>

</body>
</html>
