<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasz Vikk – Fizetés</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}

input, select, button{
width:90%;
max-width:420px;
padding:12px;
margin:8px 0;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:black;
color:white;
border:none;
cursor:pointer;
}

#map{
height:300px;
width:90%;
max-width:420px;
margin:10px auto;
display:none;
border-radius:10px;
}

#summary{
font-weight:bold;
margin-top:15px;
}
</style>
</head>

<body>

<h1>Fizetés</h1>

<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefonszám">

<select id="shipping" onchange="shippingChanged()">
<option value="">Szállítás</option>
<option value="fox">Foxpost</option>
<option value="packeta">Packeta</option>
</select>

<div id="map"></div>

<input id="pickup" placeholder="Átvételi pont" readonly>

<button onclick="checkout()">Fizetés</button>

<div id="summary"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ===== ÖSSZEG ===== */
let total = localStorage.getItem("cartTotal") || 0;
document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

/* ===== FOXPOST + PACKETA MAP ===== */

let map;
let marker;

function shippingChanged(){

const type = document.getElementById("shipping").value;

document.getElementById("pickup").value = "";
document.getElementById("map").style.display = "none";

if(type === "fox" || type === "packeta"){
initMap(type);
}

}

/* ===== MAP INIT ===== */

function initMap(type){

document.getElementById("map").style.display = "block";

if(map){
map.remove();
}

map = L.map('map').setView([47.4979, 19.0402], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OSM'
}).addTo(map);

/* MOCK PONTOK (ide később jön teljes API) */

let points = [];

if(type === "fox"){
points = foxPoints;
}

if(type === "packeta"){
points = packetaPoints;
}

points.forEach(p=>{

let m = L.marker(p.coords).addTo(map);

m.on("click", ()=>{

document.getElementById("pickup").value = p.name;

});

});

}

/* ===== FOXPOST PONTOK (teljes HU minta bővíthető API-val később) ===== */

const foxPoints = [
{name:"Budapest Deák",coords:[47.4979,19.0402]},
{name:"Miskolc Centrum",coords:[48.1031,20.7784]},
{name:"Debrecen Fórum",coords:[47.5316,21.6273]},
{name:"Szeged Árkád",coords:[46.2530,20.1414]},
{name:"Pécs Árkád",coords:[46.0727,18.2323]},
{name:"Győr Belváros",coords:[47.6875,17.6504]},
{name:"Eger Centrum",coords:[47.9025,20.3772]}
];

/* ===== PACKETA PONTOK ===== */

const packetaPoints = [
{name:"Budapest Westend Z-BOX",coords:[47.5062,19.0633]},
{name:"Miskolc Szinvapark Z-BOX",coords:[48.1031,20.7784]},
{name:"Debrecen Pláza Z-BOX",coords:[47.5316,21.6273]},
{name:"Szeged Belváros Z-BOX",coords:[46.2530,20.1414]},
{name:"Pécs Centrum Z-BOX",coords:[46.0727,18.2323]}
];

/* ===== CHECKOUT ===== */

function checkout(){

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;
const shipping = document.getElementById("shipping").value;
const pickup = document.getElementById("pickup").value;

if(!name || !email || !phone || !shipping || !pickup){
alert("Minden adat kötelező");
return;
}

alert("Stripe fizetés indul (következő lépés)");

}

</script>

</body>
</html>
