<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasz Vikk – Fizetés</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
padding:20px;
color:#222;
}

h1{
margin-top:30px;
font-size:32px;
}

input, button{
width:90%;
max-width:420px;
padding:14px;
margin:8px 0;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:black;
color:white;
border:none;
cursor:pointer;
}

button:hover{
opacity:0.95;
}

#pickup{
background:#f5f5f5;
cursor:pointer;
}

#summary{
margin-top:18px;
font-size:22px;
font-weight:bold;
}

#step2{
display:none;
}

.small{
font-size:14px;
color:#666;
margin-top:5px;
}

</style>
</head>

<body>

<h1>Fizetés</h1>

<!-- STEP 1 -->

<div id="step1">

<input id="name" placeholder="Teljes név">

<input id="email" type="email" placeholder="Email cím">

<input id="phone" placeholder="Telefonszám">

<input id="pickup" placeholder="Packeta átvételi pont">

<div class="small">
Kattints a mezőre és válassz Packeta pontot
</div>

<button onclick="nextStep()">
Tovább
</button>

</div>

<!-- STEP 2 -->

<div id="step2">

<div id="summary"></div>

<button onclick="pay()">
Fizetés indítása
</button>

</div>

<script src="https://widget.packeta.com/v6/www/js/library.js"></script>

<script>

let total = parseInt(localStorage.getItem("cartTotal")) || 0;

/* PACKETA FIX – input click */
document.getElementById("pickup").addEventListener("click", openPacketa);

function openPacketa(){

Packeta.Widget.pick(
"test",
function(point){

if(!point) return;

document.getElementById("pickup").value =
point.name + " - " + point.city;

},
{
language:"hu",
country:"hu",
view:"modal"
}

);

}

/* STEP 1 → STEP 2 */

function nextStep(){

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const phone = document.getElementById("phone").value.trim();
const pickup = document.getElementById("pickup").value.trim();

if(!name || !email || !phone || !pickup){
alert("Minden mezőt ki kell tölteni.");
return;
}

document.getElementById("step1").style.display = "none";
document.getElementById("step2").style.display = "block";

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

}

/* FIZETÉS */

function pay(){

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const phone = document.getElementById("phone").value.trim();
const pickup = document.getElementById("pickup").value.trim();

if(!name || !email || !phone || !pickup){
alert("Hiányzó adatok");
return;
}

localStorage.setItem("buyerName", name);
localStorage.setItem("buyerEmail", email);
localStorage.setItem("buyerPhone", phone);
localStorage.setItem("pickupPoint", pickup);

/* STRIPE INDÍTÁS (backend kell hozzá) */

fetch("create-checkout-session", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
amount: total,
name,
email,
phone,
pickup
})
})
.then(res => res.json())
.then(session => {
window.location.href = session.url;
})
.catch(err => {
alert("Fizetési hiba történt");
console.log(err);
});

}

</script>

</body>
</html>
