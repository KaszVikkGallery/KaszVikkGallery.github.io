<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout FIX</title>

<style>
body{font-family:Arial;text-align:center;padding:20px;}
input,select,button{padding:10px;width:90%;max-width:400px;margin:8px;}
button{background:black;color:white;border:none;border-radius:8px;}
#map{height:300px;width:90%;max-width:400px;margin:auto;display:none;}
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>

<body>

<h2>Fizetés</h2>

<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefon">

<select id="shipping" onchange="changeShip()">
<option value="">Szállítás</option>
<option value="fox">Foxpost</option>
<option value="packeta">Packeta</option>
</select>

<div id="map"></div>

<input id="pickup" placeholder="Átvételi pont" readonly>

<button onclick="selectPickup()">Átvételi pont</button>

<div id="sum"></div>

<button onclick="pay()">Fizetés</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let total = parseInt(localStorage.getItem("cartTotal")) || 0;
document.getElementById("sum").innerText = "Összeg: " + total + " Ft";

let map;

/* FOXPOST MINI LISTA (STABIL) */
const fox = [
["Budapest",47.4979,19.0402],
["Miskolc",48.1031,20.7784],
["Debrecen",47.5316,21.6273],
["Szeged",46.2530,20.1414],
["Pécs",46.0727,18.2323]
];

function changeShip(){
document.getElementById("pickup").value="";
document.getElementById("map").style.display="none";
}

/* PICKER */
function selectPickup(){

let type=document.getElementById("shipping").value;

if(!type){
alert("Válassz szállítást");
return;
}

/* PACKETA */
if(type==="packeta"){
alert("Packeta widget indul");
return;
}

/* FOX */
if(type==="fox"){
openMap();
}

}

/* MAP */
function openMap(){

document.getElementById("map").style.display="block";

if(map) map.remove();

map=L.map("map").setView([47.2,19.5],7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

fox.forEach(p=>{

let m=L.marker([p[1],p[2]]).addTo(map);

m.on("click",()=>{
document.getElementById("pickup").value=p[0];
});

});

}

/* PAY */
function pay(){

if(!document.getElementById("name").value ||
!document.getElementById("email").value ||
!document.getElementById("phone").value ||
!document.getElementById("shipping").value ||
!document.getElementById("pickup").value){

alert("Hiányzó adat");
return;
}

alert("OK → Stripe következő lépés");

}

</script>

</body>
</html>
