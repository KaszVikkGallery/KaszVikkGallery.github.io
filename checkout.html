<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasz Vikk – Fizetés</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
padding:20px;
}

h1{ margin-top:40px; }

input, select{
width:90%;
max-width:420px;
padding:12px;
margin:8px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:90%;
max-width:420px;
padding:14px;
margin-top:12px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:black;
color:white;
}

.secondary{
background:#eee;
color:#222;
}

#summary{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

#pickupBox{
margin-top:15px;
display:none;
}

.point{
padding:10px;
margin:6px auto;
max-width:420px;
border:1px solid #ddd;
border-radius:8px;
cursor:pointer;
}

.point:hover{
background:#f2f2f2;
}

#pickupStatus{
margin-top:10px;
color:green;
}
</style>
</head>

<body>

<h1>Fizetés</h1>

<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefonszám">

<select id="shipping" onchange="loadPoints()">
<option value="">Szállítás</option>
<option value="foxpost">Foxpost</option>
<option value="packeta">Packeta</option>
</select>

<div id="pickupBox"></div>

<input id="pickup" placeholder="Átvételi pont" readonly>

<div id="pickupStatus"></div>

<div id="summary"></div>

<button onclick="goToStripe()">Fizetés indítása</button>

<script>

let total = localStorage.getItem("cartTotal") || 0;

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

/* FAKE LISTA (itt később bővítjük országosra API-val) */

const foxpostPoints = [
"Budapest Deák tér",
"Miskolc Pláza",
"Debrecen Fórum",
"Szeged Árkád",
"Pécs Centrum"
];

const packetaPoints = [
"Budapest Westend Z-BOX",
"Miskolc Szinvapark Z-BOX",
"Debrecen Pláza Z-BOX",
"Szeged Belváros Z-BOX",
"Pécs Központ Z-BOX"
];

function loadPoints(){

const type = document.getElementById("shipping").value;
const box = document.getElementById("pickupBox");

box.innerHTML = "";
box.style.display = "block";

let list = [];

if(type === "foxpost") list = foxpostPoints;
if(type === "packeta") list = packetaPoints;

list.forEach(p=>{
const div = document.createElement("div");
div.className = "point";
div.innerText = p;

div.onclick = () => {
document.getElementById("pickup").value = p;
document.getElementById("pickupStatus").innerText =
"✔ kiválasztva: " + p;

box.style.display = "none";
};

box.appendChild(div);
});

}

function goToStripe(){

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;
const shipping = document.getElementById("shipping").value;
const pickup = document.getElementById("pickup").value;

if(!name || !email || !phone || !shipping || !pickup){
alert("Minden mezőt tölts ki!");
return;
}

alert("Stripe fizetés indul");

}

</script>

</body>
</html>
