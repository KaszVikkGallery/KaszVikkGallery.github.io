<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasz Vikk – Fizetés</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
padding:20px;
color:#222;
}

h1{
margin-top:30px;
font-size:32px;
}

input, button{
width:90%;
max-width:420px;
padding:14px;
margin:8px 0;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:black;
color:white;
border:none;
cursor:pointer;
}

button:hover{
opacity:0.95;
}

#pickup{
background:#f5f5f5;
}

#summary{
margin-top:18px;
font-size:22px;
font-weight:bold;
}

.small{
font-size:14px;
color:#666;
margin-top:5px;
}

</style>
</head>

<body>

<h1>Fizetés</h1>

<!-- ADATOK -->

<input id="name" placeholder="Teljes név">

<input id="email" type="email" placeholder="Email cím">

<input id="phone" placeholder="Telefonszám">

<!-- ÁTVÉTELI PONT -->

<input id="pickup" placeholder="Packeta átvételi pont" readonly>

<button onclick="openPacketa()">
Átvételi pont kiválasztása
</button>

<div class="small">
Kattints a gombra és válaszd ki a hozzád legközelebbi átvételi pontot.
</div>

<!-- ÖSSZEG -->

<div id="summary"></div>

<!-- FIZETÉS -->

<button onclick="pay()">
Fizetés indítása
</button>

<!-- PACKETA -->

<script src="https://widget.packeta.com/v6/www/js/library.js"></script>

<script>

/* VÉGÖSSZEG BETÖLTÉSE */
/* EZ MÁR TARTALMAZZA A SZÁLLÍTÁST */

let total = parseInt(localStorage.getItem("cartTotal")) || 0;

/* KIÍRÁS */

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

/* PACKETA */

function openPacketa(){

Packeta.Widget.pick(

"test",

function(point){

if(!point) return;

document.getElementById("pickup").value =
point.name + " — " + point.city;

},

{
language:"hu",
country:"hu"
}

);

}

/* FIZETÉS */

function pay(){

const name =
document.getElementById("name").value.trim();

const email =
document.getElementById("email").value.trim();

const phone =
document.getElementById("phone").value.trim();

const pickup =
document.getElementById("pickup").value.trim();

/* ELLENŐRZÉS */

if(!name || !email || !phone || !pickup){

alert("Kérlek tölts ki minden mezőt.");

return;

}

/* MENTÉS */

localStorage.setItem("buyerName", name);
localStorage.setItem("buyerEmail", email);
localStorage.setItem("buyerPhone", phone);
localStorage.setItem("pickupPoint", pickup);

/* STRIPE HELY */

alert("Sikeres adatellenőrzés. Itt indul majd a Stripe fizetés.");

}

/* ENTER */

document.addEventListener("keydown", function(e){

if(e.key === "Enter"){
pay();
}

});

</script>

</body>
</html>
