<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasz Vikk – Fizetés</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}

input, select, button{
width:90%;
max-width:420px;
padding:12px;
margin:8px 0;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:black;
color:white;
border:none;
cursor:pointer;
}

#map{
height:320px;
width:90%;
max-width:420px;
margin:10px auto;
border-radius:10px;
display:none;
}

#summary{
font-weight:bold;
margin-top:15px;
}

#pickup{
background:#f7f7f7;
}
</style>
</head>

<body>

<h1>Fizetés</h1>

<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefonszám">

<select id="shipping" onchange="changeShipping()">
<option value="">Szállítás</option>
<option value="fox">Foxpost</option>
<option value="packeta">Packeta</option>
</select>

<div id="map"></div>

<input id="pickup" placeholder="Átvételi pont" readonly>

<button onclick="openSelector()">Átvételi pont kiválasztása</button>

<div id="summary"></div>

<button onclick="pay()">Fizetés</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://widget.packeta.com/www/js/library.js"></script>

<script>

let total = localStorage.getItem("cartTotal") || 0;
document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

let map;
let markers = [];

/* FOXPOST PONTOK (reális HU lefedés minta) */
const foxPoints = [
{name:"Budapest Deák",lat:47.4979,lng:19.0402},
{name:"Budapest Westend",lat:47.5062,lng:19.0633},
{name:"Miskolc Centrum",lat:48.1031,lng:20.7784},
{name:"Debrecen Fórum",lat:47.5316,lng:21.6273},
{name:"Szeged Árkád",lat:46.2530,lng:20.1414},
{name:"Pécs Árkád",lat:46.0727,lng:18.2323},
{name:"Győr Belváros",lat:47.6875,lng:17.6504},
{name:"Eger Centrum",lat:47.9025,lng:20.3772}
];

/* SZÁLLÍTÁS VÁLTÁS */
function changeShipping(){
document.getElementById("pickup").value = "";
document.getElementById("map").style.display = "none";
}

/* SELECTOR */
function openSelector(){

const type = document.getElementById("shipping").value;

if(!type){
alert("Válassz szállítást");
return;
}

/* PACKETA */
if(type === "packeta"){
Packeta.Widget.pick(
"test",
function(point){
if(!point) return;

document.getElementById("pickup").value =
point.name + ", " + point.city;
},
{language:"hu",country:"hu"}
);
}

/* FOXPOST */
if(type === "fox"){
openFoxMap();
}

}

/* FOX MAP */
function openFoxMap(){

document.getElementById("map").style.display = "block";

if(map) map.remove();

map = L.map("map").setView([47.2,19.5],7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

foxPoints.forEach(p=>{

let m = L.marker([p.lat,p.lng]).addTo(map);

m.on("click",()=>{

document.getElementById("pickup").value = p.name;

});

});

}

/* PAY */
function pay(){

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;
const shipping = document.getElementById("shipping").value;
const pickup = document.getElementById("pickup").value;

if(!name || !email || !phone || !shipping || !pickup){
alert("Minden mezőt tölts ki");
return;
}

alert("Sikeres adatellenőrzés. Stripe következik.");

}

</script>

</body>
</html>
