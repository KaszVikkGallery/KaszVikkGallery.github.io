<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasz Vikk – Fizetés</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#222;
text-align:center;
padding:20px;
}

h1{
margin-top:40px;
font-size:32px;
}

input, select{
width:90%;
max-width:420px;
padding:12px;
margin:8px 0;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
width:90%;
max-width:420px;
padding:14px;
margin-top:12px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:black;
color:white;
}

.secondary{
background:#eee;
color:#222;
}

#summary{
margin-top:20px;
font-size:20px;
font-weight:bold;
}

#pickupStatus{
margin-top:10px;
color:green;
font-size:14px;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<h1>Fizetés</h1>

<!-- ADATOK -->
<input id="name" placeholder="Név">

<input id="email" type="email" placeholder="Email">

<input id="phone" placeholder="Telefonszám">

<!-- SZÁLLÍTÁS -->
<select id="shipping" onchange="shippingChanged()">

<option value="">Szállítás módja</option>

<option value="foxpost">Foxpost</option>

<option value="packeta">Packeta</option>

</select>

<!-- PACKETA GOMB -->
<button
id="packetaBtn"
class="hidden"
type="button"
onclick="openPacketa()">

Packeta átvételi pont választása

</button>

<!-- FOXPOST -->
<input
id="foxpostInput"
class="hidden"
placeholder="Foxpost automata neve vagy címe">

<!-- KIVÁLASZTOTT -->
<input
id="pickup"
placeholder="Kiválasztott átvételi pont"
readonly>

<div id="pickupStatus"></div>

<!-- ÖSSZEG -->
<div id="summary"></div>

<!-- FIZETÉS -->
<button onclick="goToStripe()">
Fizetés indítása
</button>

<!-- PACKETA WIDGET -->
<script src="https://widget.packeta.com/www/js/library.js"></script>

<script>

/* ÖSSZEG */

let total =
localStorage.getItem("cartTotal") || 0;

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

/* SZÁLLÍTÁS VÁLTÁS */

function shippingChanged(){

const type =
document.getElementById("shipping").value;

document.getElementById("packetaBtn")
.classList.add("hidden");

document.getElementById("foxpostInput")
.classList.add("hidden");

document.getElementById("pickup").value = "";

document.getElementById("pickupStatus")
.innerText = "";

if(type === "packeta"){

document.getElementById("packetaBtn")
.classList.remove("hidden");

}

if(type === "foxpost"){

document.getElementById("foxpostInput")
.classList.remove("hidden");

}

}

/* PACKETA */

const packetaApiKey =
"test";

function openPacketa(){

Packeta.Widget.pick(
packetaApiKey,
showSelectedPickupPoint,
{
language: "hu",
country: "hu",
view: "modal"
}
);

}

function showSelectedPickupPoint(point){

if(!point) return;

const text =
point.name + ", "
+ point.city + ", "
+ point.street;

document.getElementById("pickup").value =
text;

document.getElementById("pickupStatus")
.innerText =
"✔ Kiválasztva: " + text;

}

/* FIZETÉS */

function goToStripe(){

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const phone =
document.getElementById("phone").value;

const shipping =
document.getElementById("shipping").value;

let pickup =
document.getElementById("pickup").value;

/* FOXPOST */

if(shipping === "foxpost"){

pickup =
document.getElementById("foxpostInput").value;

document.getElementById("pickup").value =
pickup;

}

if(
!name ||
!email ||
!phone ||
!shipping ||
!pickup
){

alert("Minden mezőt tölts ki!");
return;

}

/* IDE JÖN MAJD A STRIPE */

alert(
"Sikeres adatellenőrzés. Itt indul majd a Stripe fizetés."
);

}

</script>

</body>
</html>
