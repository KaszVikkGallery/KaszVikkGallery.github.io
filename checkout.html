<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fizetés – Kasz Vikk</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#222;
  text-align:center;
  padding:20px;
}

h1{
  margin-top:40px;
  font-size:32px;
}

input, select{
  width:90%;
  max-width:400px;
  padding:12px;
  margin:8px 0;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:90%;
  max-width:400px;
  padding:14px;
  margin-top:15px;
  font-size:18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:black;
  color:white;
}

.secondary{
  background:#eee;
  color:#222;
}

#summary{
  margin-top:20px;
  font-size:18px;
}

small{
  color:#666;
}
</style>
</head>

<body>

<h1>Fizetés</h1>

<!-- ADATOK -->
<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefonszám">

<!-- SZÁLLÍTÁS -->
<select id="shipping" onchange="resetPickup()">
  <option value="">Szállítás módja</option>
  <option value="foxpost">Foxpost</option>
  <option value="packeta">Packeta</option>
</select>

<!-- ÁTVÉTELI PONT -->
<input id="pickup" placeholder="Átvételi pont (válaszd ki lent)" readonly>

<button class="secondary" onclick="openPickupSelector()">
Átvételi pont kiválasztása
</button>

<!-- ÖSSZEG -->
<div id="summary"></div>

<button onclick="goToStripe()">
Fizetés indítása
</button>

<script>

let totalFromCart = localStorage.getItem("cartTotal") || 0;

document.getElementById("summary").innerText =
"Fizetendő: " + totalFromCart + " Ft";

function resetPickup(){
  document.getElementById("pickup").value = "";
}

function openPickupSelector(){

  const type = document.getElementById("shipping").value;

  if(!type){
    alert("Előbb válassz szállítást!");
    return;
  }

  if(type === "foxpost"){
    window.open("https://www.foxpost.hu/csomagautomata-kereso", "_blank");
  }

  if(type === "packeta"){
    window.open("https://www.packeta.hu/atveteli-pontok", "_blank");
  }

  alert("Másold be ide az átvételi pont nevét.");
}

function goToStripe(){

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const shipping = document.getElementById("shipping").value;
  const pickup = document.getElementById("pickup").value;

  if(!name || !email || !shipping || !pickup){
    alert("Minden mezőt tölts ki!");
    return;
  }

  alert("Itt fog átmenni Stripe-ra (következő lépés).");

  // ide kötjük majd a Stripe checkoutot
}

</script>

</body>
</html>
