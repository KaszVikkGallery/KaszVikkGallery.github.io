<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasz Vikk – Fizetés</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#222;
text-align:center;
padding:20px;
}

h1{
margin-top:40px;
font-size:32px;
}

input, select{
width:90%;
max-width:420px;
padding:12px;
margin:8px 0;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
width:90%;
max-width:420px;
padding:14px;
margin-top:12px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:black;
color:white;
}

.hidden{
display:none;
}

#summary{
margin-top:20px;
font-size:20px;
font-weight:bold;
}

#pickupStatus{
margin-top:10px;
font-size:14px;
color:green;
}

/* FOXPOST MODAL */

#foxModal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:9999;
}

#foxBox{
background:white;
width:90%;
max-width:500px;
margin:40px auto;
padding:20px;
border-radius:14px;
max-height:80vh;
overflow:auto;
}

.fox-item{
padding:14px;
border:1px solid #ddd;
border-radius:10px;
margin:8px 0;
cursor:pointer;
text-align:left;
transition:0.2s;
}

.fox-item:hover{
background:#f5f5f5;
}

#foxSearch{
margin-bottom:10px;
}

</style>
</head>

<body>

<h1>Fizetés</h1>

<input id="name" placeholder="Név">

<input id="email" type="email" placeholder="Email">

<input id="phone" placeholder="Telefonszám">

<select id="shipping" onchange="shippingChanged()">

<option value="">Szállítás módja</option>

<option value="foxpost">Foxpost</option>

<option value="packeta">Packeta</option>

</select>

<!-- FOXPOST -->
<button
id="foxBtn"
class="hidden"
onclick="openFoxpost()">

Foxpost automata választása

</button>

<!-- PACKETA -->
<button
id="packetaBtn"
class="hidden"
onclick="openPacketa()">

Packeta átvételi pont választása

</button>

<input
id="pickup"
placeholder="Kiválasztott átvételi pont"
readonly>

<div id="pickupStatus"></div>

<div id="summary"></div>

<button onclick="goToStripe()">

Fizetés indítása

</button>

<!-- FOXPOST MODAL -->

<div id="foxModal">

<div id="foxBox">

<h2>Foxpost automaták</h2>

<input
id="foxSearch"
placeholder="Keresés városra..."
oninput="filterFoxpost()">

<div id="foxList"></div>

<button onclick="closeFoxpost()">

Bezárás

</button>

</div>

</div>

<!-- PACKETA -->

<script src="https://widget.packeta.com/www/js/library.js"></script>

<script>

/* ÖSSZEG */

let total =
localStorage.getItem("cartTotal") || 0;

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

/* FOXPOST PONTOK */

const foxpostPoints = [

"Budapest – Deák tér automata",
"Budapest – Árkád automata",
"Budapest – Westend automata",
"Budapest – Etele Plaza automata",
"Budapest – Allee automata",

"Miskolc – Szinvapark automata",
"Miskolc – Plaza automata",
"Miskolc – Auchan automata",

"Debrecen – Fórum automata",
"Debrecen – Tesco automata",

"Nyíregyháza – Korzó automata",

"Szeged – Árkád automata",
"Szeged – Tesco automata",

"Pécs – Árkád automata",

"Győr – Belváros automata",

"Eger – Tesco automata",

"Kazincbarcika – Tesco automata",

"Ózd – Center automata",

"Sátoraljaújhely – Tesco automata",

"Szerencs – Penny automata",

"Mezőkövesd – Lidl automata",

"Tiszaújváros – Spar automata",

"Salgótarján – Tesco automata",

"Kecskemét – Malom automata",

"Szolnok – Plaza automata",

"Sopron – Tesco automata",

"Veszprém – Stop Shop automata",

"Székesfehérvár – Alba Plaza automata",

"Zalaegerszeg – Tesco automata",

"Kaposvár – Tesco automata"

];

/* SZÁLLÍTÁS */

function shippingChanged(){

const type =
document.getElementById("shipping").value;

document.getElementById("foxBtn")
.classList.add("hidden");

document.getElementById("packetaBtn")
.classList.add("hidden");

document.getElementById("pickup").value = "";

document.getElementById("pickupStatus")
.innerText = "";

if(type === "foxpost"){

document.getElementById("foxBtn")
.classList.remove("hidden");

renderFoxpost(foxpostPoints);

}

if(type === "packeta"){

document.getElementById("packetaBtn")
.classList.remove("hidden");

}

}

/* PACKETA */

const packetaApiKey = "test";

function openPacketa(){

Packeta.Widget.pick(
packetaApiKey,
showSelectedPickupPoint,
{
language:"hu",
country:"hu",
view:"modal"
}
);

}

function showSelectedPickupPoint(point){

if(!point) return;

const text =
point.name + ", "
+ point.city + ", "
+ point.street;

document.getElementById("pickup").value =
text;

document.getElementById("pickupStatus")
.innerText =
"✔ Kiválasztva: " + text;

}

/* FOXPOST */

function openFoxpost(){

document.getElementById("foxModal")
.style.display = "block";

}

function closeFoxpost(){

document.getElementById("foxModal")
.style.display = "none";

}

function renderFoxpost(list){

const box =
document.getElementById("foxList");

box.innerHTML = "";

list.forEach(p=>{

const div =
document.createElement("div");

div.className = "fox-item";

div.innerText = p;

div.onclick = () => {

document.getElementById("pickup").value =
p;

document.getElementById("pickupStatus")
.innerText =
"✔ Kiválasztva: " + p;

closeFoxpost();

};

box.appendChild(div);

});

}

function filterFoxpost(){

const q =
document.getElementById("foxSearch")
.value.toLowerCase();

const filtered =
foxpostPoints.filter(p =>
p.toLowerCase().includes(q)
);

renderFoxpost(filtered);

}

/* FIZETÉS */

function goToStripe(){

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const phone =
document.getElementById("phone").value;

const shipping =
document.getElementById("shipping").value;

const pickup =
document.getElementById("pickup").value;

if(
!name ||
!email ||
!phone ||
!shipping ||
!pickup
){

alert("Minden mezőt tölts ki!");
return;

}

alert(
"Sikeres adatellenőrzés. Itt indul majd a Stripe fizetés."
);

}

</script>

</body>
</html>
