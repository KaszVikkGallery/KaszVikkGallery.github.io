<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasz Vikk – Fizetés</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
padding:20px;
}

h1{ margin-top:40px; }

input, select{
width:90%;
max-width:420px;
padding:12px;
margin:8px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:90%;
max-width:420px;
padding:14px;
margin-top:12px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:black;
color:white;
}

.secondary{
background:#eee;
color:#222;
}

#summary{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

#pickupPanel{
display:none;
margin-top:10px;
}

#search{
width:90%;
max-width:420px;
padding:10px;
margin-top:10px;
}

.point{
max-width:420px;
margin:6px auto;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
cursor:pointer;
}

.point:hover{
background:#f2f2f2;
}

#pickupStatus{
margin-top:10px;
color:green;
font-size:14px;
}
</style>
</head>

<body>

<h1>Fizetés</h1>

<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefonszám">

<select id="shipping" onchange="openPicker()">
<option value="">Szállítás módja</option>
<option value="foxpost">Foxpost</option>
<option value="packeta">Packeta</option>
</select>

<!-- PICKER -->
<div id="pickupPanel">

<input id="search" placeholder="Keresés..." oninput="filterPoints()">

<div id="points"></div>

</div>

<input id="pickup" placeholder="Átvételi pont" readonly>

<div id="pickupStatus"></div>

<div id="summary"></div>

<button onclick="goToStripe()">Fizetés indítása</button>

<script>

let total = localStorage.getItem("cartTotal") || 0;

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

/* --- VALÓDI RÉSZ (később API-val bővítjük) --- */

const data = {
foxpost: [
"Budapest Deák tér",
"Budapest Nyugati",
"Miskolc Pláza",
"Debrecen Fórum",
"Szeged Árkád",
"Pécs Centrum",
"Győr Belváros"
],
packeta: [
"Budapest Westend Z-BOX",
"Budapest Allee Z-BOX",
"Miskolc Szinvapark Z-BOX",
"Debrecen Pláza Z-BOX",
"Szeged Belváros Z-BOX",
"Pécs Központ Z-BOX",
"Nyíregyháza Központ Z-BOX"
]
};

let currentList = [];

function openPicker(){

const type = document.getElementById("shipping").value;

if(!type){
alert("Válassz szállítást!");
return;
}

currentList = data[type];

document.getElementById("pickupPanel").style.display = "block";

renderPoints(currentList);

}

function renderPoints(list){

const box = document.getElementById("points");
box.innerHTML = "";

list.forEach(p=>{

const div = document.createElement("div");
div.className = "point";
div.innerText = p;

div.onclick = () => {
document.getElementById("pickup").value = p;
document.getElementById("pickupStatus").innerText =
"✔ kiválasztva: " + p;

document.getElementById("pickupPanel").style.display = "none";
};

box.appendChild(div);

});

}

function filterPoints(){

const q = document.getElementById("search").value.toLowerCase();

const filtered = currentList.filter(p =>
p.toLowerCase().includes(q)
);

renderPoints(filtered);

}

function goToStripe(){

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;
const shipping = document.getElementById("shipping").value;
const pickup = document.getElementById("pickup").value;

if(!name || !email || !phone || !shipping || !pickup){
alert("Minden mezőt tölts ki!");
return;
}

alert("Stripe fizetés indul");

}

</script>

</body>
</html>
