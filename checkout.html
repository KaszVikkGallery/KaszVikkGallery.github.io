<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasz Vikk – Fizetés</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
padding:20px;
}

h1{ margin-top:40px; }

input, select{
width:90%;
max-width:420px;
padding:12px;
margin:8px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:90%;
max-width:420px;
padding:14px;
margin-top:12px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:black;
color:white;
}

.secondary{
background:#eee;
color:#222;
}

#summary{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

/* PICKER BOX */
#pickupContainer{
margin-top:15px;
}

iframe{
width:100%;
max-width:420px;
height:420px;
border:0;
border-radius:10px;
}
</style>
</head>

<body>

<h1>Fizetés</h1>

<!-- ADATOK -->
<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefonszám">

<!-- SZÁLLÍTÁS -->
<select id="shipping" onchange="loadPickup()">
  <option value="">Szállítás módja</option>
  <option value="foxpost">Foxpost</option>
  <option value="packeta">Packeta</option>
</select>

<!-- PICKER -->
<div id="pickupContainer"></div>

<input id="pickup" placeholder="Átvételi pont" readonly>

<!-- ÖSSZEG -->
<div id="summary"></div>

<button onclick="goToStripe()">Fizetés indítása</button>

<script>

let total = localStorage.getItem("cartTotal") || 0;

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

function loadPickup(){

const type = document.getElementById("shipping").value;
const box = document.getElementById("pickupContainer");

document.getElementById("pickup").value = "";

if(type === "foxpost"){
box.innerHTML = `
<iframe src="https://www.foxpost.hu/csomagautomata-kereso"></iframe>
`;
}

else if(type === "packeta"){
box.innerHTML = `
<iframe src="https://www.packeta.hu/atveteli-pontok"></iframe>
`;
}

else{
box.innerHTML = "";
}

}

function goToStripe(){

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;
const shipping = document.getElementById("shipping").value;
const pickup = document.getElementById("pickup").value;

if(!name || !email || !phone || !shipping || !pickup){
alert("Minden mezőt tölts ki!");
return;
}

alert("Stripe fizetés indul (következő lépés)");

}

</script>

</body>
</html>
