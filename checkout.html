<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasz Vikk – Checkout</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
font-family:Arial;
text-align:center;
padding:20px;
}

input,select,button{
width:90%;
max-width:420px;
padding:12px;
margin:8px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:black;
color:white;
border:none;
cursor:pointer;
}

#map{
height:300px;
width:90%;
max-width:420px;
margin:auto;
display:none;
}
</style>
</head>

<body>

<h2>Fizetés</h2>

<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefon">

<select id="shipping" onchange="resetPickup()">
<option value="">Szállítás</option>
<option value="fox">Foxpost</option>
<option value="packeta">Packeta</option>
</select>

<input id="pickup" placeholder="Átvételi pont" readonly>

<button onclick="openPickup()">Átvételi pont kiválasztása</button>

<div id="map"></div>

<div id="sum"></div>

<button onclick="pay()">Fizetés</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let total = localStorage.getItem("cartTotal") || 0;
document.getElementById("sum").innerText = "Összeg: " + total + " Ft";

let map;

function resetPickup(){
document.getElementById("pickup").value="";
document.getElementById("map").style.display="none";
}

function openPickup(){

let type=document.getElementById("shipping").value;

if(!type){
alert("Válassz szállítást");
return;
}

/* PACKETA (nem törjük el, csak jelzés) */
if(type==="packeta"){
alert("Packeta widget jön majd (itt volt a működő verzió)");
return;
}

function showMap(){

document.getElementById("map").style.display="block";

if(map) map.remove();

map=L.map("map").setView([47.2,19.5],7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

foxPoints.forEach(p=>{

let m=L.marker([p[1],p[2]]).addTo(map);

m.on("click",()=>{
document.getElementById("pickup").value=p[0];
});

});

}

function pay(){

if(!document.getElementById("name").value ||
!document.getElementById("email").value ||
!document.getElementById("phone").value ||
!document.getElementById("shipping").value ||
!document.getElementById("pickup").value){

alert("Minden mezőt tölts ki");
return;
}

alert("OK → Stripe következik");

}

</script>

</body>
</html>
