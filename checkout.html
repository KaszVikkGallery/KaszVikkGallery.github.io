<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasz Vikk – Fizetés</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
padding:20px;
}

h1{
margin-top:40px;
}

input, select{
width:90%;
max-width:420px;
padding:12px;
margin:8px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:90%;
max-width:420px;
padding:14px;
margin-top:12px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:black;
color:white;
}

.secondary{
background:#eee;
color:#222;
}

#summary{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

/* MODAL */
#pickupModal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.5);
z-index:9999;
}

#pickupBox{
background:#fff;
max-width:420px;
margin:80px auto;
padding:20px;
border-radius:12px;
text-align:left;
}

#pickupList{
width:100%;
padding:10px;
margin-top:10px;
}

.modal-buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.modal-buttons button{
flex:1;
}
</style>
</head>

<body>

<h1>Fizetés</h1>

<!-- ADATOK -->
<input id="name" placeholder="Név">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Telefonszám">

<!-- SZÁLLÍTÁS -->
<select id="shipping" onchange="resetPickup()">
  <option value="">Szállítás módja</option>
  <option value="foxpost">Foxpost</option>
  <option value="packeta">Packeta</option>
</select>

<!-- ÁTVÉTELI PONT -->
<input id="pickup" placeholder="Átvételi pont" readonly>

<button class="secondary" onclick="openPickupSelector()">
Átvételi pont kiválasztása
</button>

<!-- ÖSSZEG -->
<div id="summary"></div>

<button onclick="goToStripe()">
Fizetés indítása
</button>

<!-- MODAL -->
<div id="pickupModal">
  <div id="pickupBox">

    <h3>Átvételi pont választás</h3>

    <select id="pickupList">
      <option value="">Válassz pontot</option>

      <optgroup label="FOXPOST">
        <option>Budapest - Deák tér automata</option>
        <option>Miskolc - Centrum automata</option>
        <option>Debrecen - Fórum automata</option>
        <option>Szeged - Árkád automata</option>
        <option>Pécs - Árkád automata</option>
      </optgroup>

      <optgroup label="PACKETA">
        <option>Budapest - Westend Z-BOX</option>
        <option>Miskolc - Szinvapark Z-BOX</option>
        <option>Debrecen - Pláza Z-BOX</option>
        <option>Szeged - Belváros Z-BOX</option>
        <option>Pécs - Centrum Z-BOX</option>
      </optgroup>
    </select>

    <div class="modal-buttons">
      <button onclick="confirmPickup()">OK</button>
      <button onclick="closePickup()">Mégse</button>
    </div>

  </div>
</div>

<script>

let total = localStorage.getItem("cartTotal") || 0;

document.getElementById("summary").innerText =
"Fizetendő: " + total + " Ft";

function resetPickup(){
document.getElementById("pickup").value = "";
}

function openPickupSelector(){

const type = document.getElementById("shipping").value;

if(!type){
alert("Előbb válassz szállítást!");
return;
}

document.getElementById("pickupModal").style.display = "block";
}

function closePickup(){
document.getElementById("pickupModal").style.display = "none";
}

function confirmPickup(){

const val = document.getElementById("pickupList").value;

if(!val){
alert("Válassz egy pontot!");
return;
}

document.getElementById("pickup").value = val;
closePickup();
}

function goToStripe(){

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;
const shipping = document.getElementById("shipping").value;
const pickup = document.getElementById("pickup").value;

if(!name || !email || !phone || !shipping || !pickup){
alert("Minden mezőt tölts ki!");
return;
}

alert("Stripe fizetés következik");

}

</script>

</body>
</html>
