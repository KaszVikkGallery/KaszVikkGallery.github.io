<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">

<title>Lidokain – Kasz Vikk</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#fff;
  color:#222;
}

/* ===== CÍM ===== */

h1{
  font-size:34px;
  margin-top:90px;
}

/* ===== SZÖVEG ===== */

p{
  font-size:20px;
  margin:10px auto;
  max-width:800px;
  line-height:1.4;
}

/* ===== KÉP ===== */

.main-image{
  max-width:80%;
  margin-top:20px;
  cursor:zoom-in;
}

/* ===== GOMBOK ===== */

button{
  font-size:18px;
  padding:12px 18px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

.back-btn{
  margin-top:20px;
  background:#f2f2f2;
  color:#222;
}

/* ===== LIGHTBOX ===== */

#lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

#lightbox img{
  max-width:90%;
  max-height:90%;
}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  cursor:pointer;
  user-select:none;
}

#prev{ left:30px; }
#next{ right:30px; }

</style>
</head>

<body>

<h1>Lidokain</h1>

<img class="main-image" src="lidokainmessze.jpg" onclick="openLightbox()">

<div>
  <button onclick="prev()">◀</button>
  <button onclick="next()">▶</button>
</div>

<p>
A "Lidokain" nem más, mint minden, ami elnyomja a fájdalmat. Az alkohol, drog, bulik, csillogás. De közben belül: üresség és csend.
</p>

<p>Technika: Akril</p>
<p>Vászon típus: Feszített vászon</p>
<p>Méret: 18 × 24 cm</p>
<p>Ára: 3 000 Forint</p>

<a href="index.html">
<button class="back-btn">← Vissza</button>
</a>

<!-- ===== LIGHTBOX ===== -->
<div id="lightbox" onclick="closeLightbox()">

  <div id="prev" class="arrow" onclick="event.stopPropagation(); prev()">◀</div>

  <img id="lightboxImg">

  <div id="next" class="arrow" onclick="event.stopPropagation(); next()">▶</div>

</div>

<script>

const images = [
  "lidokainmessze.jpg",
  "lidokainjobb.jpg",
  "lidokainbal.jpg"
];

let current = 0;

function openLightbox(){
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightboxImg").src = images[current];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

function next(){
  current = (current + 1) % images.length;
  document.querySelector(".main-image").src = images[current];
  document.getElementById("lightboxImg").src = images[current];
}

function prev(){
  current = (current - 1 + images.length) % images.length;
  document.querySelector(".main-image").src = images[current];
  document.getElementById("lightboxImg").src = images[current];
}

</script>

</body>
</html>
