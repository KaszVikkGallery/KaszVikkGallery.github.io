<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Rendelések</title>

<style>
body{
  font-family:Arial;
  margin:0;
  padding:20px;
  background:#111;
  color:#fff;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.order{
  background:#222;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}

small{
  color:#aaa;
  display:block;
  margin-top:5px;
}

button{
  padding:10px;
  margin-bottom:20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>📦 Rendelések</h1>

<button onclick="loadOrders()">Frissítés</button>

<div id="list"></div>

<script>

async function loadOrders(){

  const list = document.getElementById("list");
  list.innerHTML = "Betöltés...";

  try {

    const res = await fetch(
      "https://kasz-vikk-gallery-github-io.vercel.app/api/save-order"
    );

    const data = await res.json();

    if(!Array.isArray(data)){
      list.innerHTML = "Nincs adat";
      return;
    }

    list.innerHTML = "";

    data.reverse().forEach(order => {

      const div = document.createElement("div");
      div.className = "order";

      const itemsText = Array.isArray(order.items)
        ? order.items.map(i => i.title || "Névtelen").join(", ")
        : "Nincs adat";

      div.innerHTML = `
        <b>Név:</b> ${order.name || ""}<br>
        <b>Email:</b> ${order.email || ""}<br>
        <b>Telefon:</b> ${order.phone || ""}<br>
        <b>Packeta:</b> ${order.pickup || ""}<br>
        <b>Festmények:</b> ${itemsText}<br>
        <b>Összeg:</b> ${order.amount ?? "N/A"} Ft<br>
        <small>${order.created_at || order.time || ""}</small>
      `;

      list.appendChild(div);

    });

  } catch (err) {
    console.error(err);
    list.innerHTML = "Hiba történt a betöltéskor";
  }

}

loadOrders();

</script>

</body>
</html>
