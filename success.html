<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Sikeres fizetés</title>
</head>
<body style="text-align:center;font-family:Arial;padding:50px;">

<h1>Köszönjük a rendelést! 🎉</h1>
<p>A fizetés sikeres volt.</p>

<a href="index.html">Vissza a főoldalra</a>
<script>
const data = JSON.parse(localStorage.getItem("lastOrder"));

if (data) {
  fetch("https://kasz-vikk-gallery-github-io.vercel.app/api/send-email", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(res => console.log("EMAIL SENT:", res))
  .catch(err => console.log("EMAIL ERROR:", err));

  localStorage.removeItem("lastOrder");
}
</script>
</body>
</html>
